[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "breadboard-harness-cli"
version = "0.0.0"
description = "BreadBoard harness authoring front door"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.100", "httpx>=0.27", "Jinja2>=3.1", "jsonschema>=4.18", "openai>=1.0.0", "pydantic>=2.13.5,<3", "python-dotenv>=1.0", "python-multipart>=0.0.9", "PyYAML>=6.0", "ray>=2.0", "requests>=2.28", "uvicorn>=0.20"]

[project.optional-dependencies]
mini = ["litellm==1.101.0"]

[project.scripts]
breadboard = "breadboard.product.cli:main"

[tool.setuptools]
py-modules = ["adaptive_iter"]
include-package-data = false
[tool.setuptools.packages.find]
where = ["."]
include = ["agent_configs.templates*", "breadboard_engine*", "breadboard", "breadboard.artifacts*", "breadboard.ext*", "breadboard.modules*", "breadboard.product*", "breadboard.rl", "breadboard.rl.harness*", "breadboard_sdk*", "config.e4_targets*", "config.product*", "conformance.comparators*", "contracts.kernel*", "contracts.public*", "contracts.internal.evidence*", "implementations*"]
namespaces = true

[tool.setuptools.package-data]
"agent_configs.templates" = ["*.yaml", "*.json"]
"agent_configs.templates.prompts" = ["*.md"]
"breadboard_engine" = ["engine-build-provenance.v1.json"]
 "breadboard.rl.harness" = ["SANDBOX_CAPABILITY_MATRIX.json", "pi_tools.mjs", "pi_tools_0_73_1.mjs", "runners/*.ts"]
 "config.e4_targets" = ["index.json", "notices/*.txt", "oh_my_pi/16.2.13/*.json", "oh_my_pi/16.2.13/*.yaml", "oh_my_pi/16.2.13/prompts/*.md", "oh_my_pi/18.1.17/*.json", "oh_my_pi/18.1.17/*.yaml", "oh_my_pi/18.1.17/*.txt", "oh_my_pi/18.1.17/prompts/*.md", "pi/0.57.1/*.json", "pi/0.57.1/*.yaml", "pi/0.57.1/*.txt", "pi/0.57.1/prompts/*.md", "pi/0.73.1/*.json", "pi/0.73.1/*.yaml", "pi/0.73.1/*.txt", "pi/0.73.1/prompts/*.md", "mini_swe_agent/2.4.6/*.json", "mini_swe_agent/2.4.6/*.yaml", "mini_swe_agent/2.4.6/*.txt", "mini_swe_agent/2.4.6/prompts/*.j2", "mini_swe_agent/2.4.6/prompts/*.md", "openhands_sdk/1.47.0/*.json", "openhands_sdk/1.47.0/*.yaml", "openhands_sdk/1.47.0/*.txt", "openhands_sdk/1.47.0/prompts/*.txt", "openhands_sdk/1.47.0/prompts/*.json", "openhands_sdk/1.47.0/prompts/*.md"]
"breadboard.rl.harness.resources.qualification" = ["canonical_artifact_vectors_v1.json", "tls/authority.json", "tls/ca.cert.pem", "tls/server.cert.pem", "tls/server.key.pem"]
"breadboard_engine.execution" = ["node/*.mjs", "node/THIRD_PARTY_NOTICES.txt"]
"breadboard_sdk.generated" = ["*.json"]
"config.product" = ["*.json"]
"conformance.comparators" = ["registry.json"]
"contracts.kernel" = ["*.json"]
"contracts.kernel.manifests" = ["*.json"]
"contracts.kernel.examples" = ["*.json"]
"contracts.kernel.registries" = ["*.json"]
"contracts.kernel.schemas" = ["*.schema.json"]
"contracts.kernel.schemas.payloads" = ["*.schema.json"]
"contracts.public" = ["*.json"]
"contracts.public.schemas" = ["*.schema.json"]
"contracts.internal.evidence" = ["operations.v1.json"]
"contracts.internal.evidence.schemas" = ["*.schema.json"]
"implementations" = ["THIRD_PARTY_NOTICES.txt"]
"implementations.tools.defs" = ["*.yaml"]
"implementations.prompts.todos" = ["*.md"]
"implementations.system_prompts" = ["*.md"]
"implementations.system_prompts.claude_code" = ["*.md"]
"implementations.system_prompts.guardrails" = ["*.md"]
"implementations.system_prompts.longrun" = ["*.md"]
"implementations.system_prompts.opencode" = ["*.md", "*.yaml"]
"implementations.tool_prompt_synthesis.opencode_patch" = ["*.md"]
"implementations.tool_prompt_synthesis.pythonic" = ["*.md"]
"implementations.tool_prompt_synthesis.unified_diff" = ["*.md"]

