[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "breadboard-harness-cli"
version = "0.0.0"
description = "BreadBoard harness authoring front door"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.100", "httpx>=0.27", "jsonschema>=4.18", "python-dotenv>=1.0", "python-multipart>=0.0.9", "PyYAML>=6.0", "ray>=2.0", "requests>=2.28", "uvicorn>=0.20"]

[project.scripts]
breadboard = "breadboard.product.cli:main"
bbh = "scripts.breadboard_cli:main"

[tool.setuptools]
py-modules = ["adaptive_iter"]
include-package-data = false
[tool.setuptools.packages.find]
where = ["."]
include = ["agent_configs*", "agentic_coder_prototype", "breadboard_engine*", "breadboard*", "breadboard_sdk*", "config*", "conformance*", "contracts*", "docs", "docs.conformance", "implementations*", "scripts*"]
exclude = ["breadboard_ext*", "docs.conformance.evidence_snapshots*", "docs_tmp*", "scripts.archive*"]
namespaces = true

[tool.setuptools.package-data]
"agent_configs.templates" = ["*.yaml", "*.json"]
"agent_configs.templates.prompts" = ["*.md"]
"breadboard_engine" = ["engine-build-provenance.v1.json"]
"breadboard.rl.harness" = ["SANDBOX_CAPABILITY_MATRIX.json"]
"breadboard_sdk.generated" = ["*.json"]
"config.e4_lanes" = ["*.yaml", "*.json"]
"config.e4_targets" = ["**/*.json", "**/*.yaml", "**/*.md"]
"config.product" = ["*.json"]
"conformance.comparators" = ["registry.json"]
"conformance.provider_differential" = ["matrix.v1.json", "scenario.v1.json", "oracle/*.json", "schemas/*.json"]
"contracts.kernel" = ["*.json"]
"contracts.kernel.manifests" = ["*.json"]
"contracts.kernel.examples" = ["*.json"]
"contracts.kernel.registries" = ["*.json"]
"contracts.kernel.schemas" = ["*.schema.json"]
"contracts.kernel.schemas.payloads" = ["*.schema.json"]
"contracts.public" = ["*.json"]
"contracts.public.schemas" = ["*.schema.json"]
"contracts.internal.evidence" = ["operations.v1.json"]
"contracts.internal.evidence.schemas" = ["*.schema.json"]
"docs.conformance" = ["e4_lane_inventory.json"]
"implementations.tools.defs" = ["*.yaml"]
"implementations.prompts.todos" = ["*.md"]
"implementations.system_prompts" = ["*.md"]
"implementations.system_prompts.claude_code" = ["*.md"]
"implementations.system_prompts.guardrails" = ["*.md"]
"implementations.system_prompts.longrun" = ["*.md"]
"implementations.system_prompts.opencode" = ["*.md", "*.yaml"]
"implementations.tool_prompt_synthesis.opencode_patch" = ["*.md"]
"implementations.tool_prompt_synthesis.pythonic" = ["*.md"]
"implementations.tool_prompt_synthesis.unified_diff" = ["*.md"]

[tool.setuptools.exclude-package-data]
"docs.conformance" = ["evidence_snapshots/**"]
