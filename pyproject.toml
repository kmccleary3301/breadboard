[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "breadboard-harness-cli"
version = "0.0.0"
description = "BreadBoard harness authoring front door"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.100", "httpx>=0.27", "Jinja2>=3.1", "jsonschema>=4.18", "openai>=1.0.0", "pydantic>=2.13.5,<3", "python-dotenv>=1.0", "python-multipart>=0.0.9", "PyYAML>=6.0", "ray>=2.0", "requests>=2.28", "uvicorn>=0.20"]

[project.optional-dependencies]
mini = ["litellm==1.101.0"]
snapcompact = ["Pillow>=10"]

[project.scripts]
breadboard = "breadboard.product.cli:main"

[tool.setuptools]
py-modules = ["adaptive_iter"]
include-package-data = false
[tool.setuptools.packages.find]
where = ["."]
include = ["agent_configs.templates*", "breadboard_engine*", "breadboard", "breadboard.artifacts*", "breadboard.ext*", "breadboard.modules*", "breadboard.product*", "breadboard.rl", "breadboard.rl.harness*", "breadboard_sdk*", "config.e4_targets*", "config.product*", "conformance.comparators*", "contracts.kernel*", "contracts.public*", "contracts.internal.evidence*", "implementations*"]
exclude = ["breadboard_engine.compaction_lanes*"]
namespaces = true

[tool.setuptools.package-data]
"agent_configs.templates" = ["*.yaml", "*.json"]
"agent_configs.templates.prompts" = ["*.md"]
"breadboard_engine" = ["engine-build-provenance.v1.json"]
"breadboard_engine.compaction" = ["prompts/*.md", "snapcompact/fonts/*"]
"breadboard_engine.compaction.presets" = ["*.yaml", "prompts/*/*"]
"breadboard.rl.harness" = ["SANDBOX_CAPABILITY_MATRIX.json", "pi_tools_0_57_1.mjs", "pi_tools_0_73_1.mjs", "pi_0_57_1_*.mjs", "pi_0_73_1_*.mjs", "hermes_*.py", "native_worker.py", "runners/*.ts", "runners/omp_16_2_13/*.ts", "runners/omp_18_1_17/*.ts", "openclaw_*.mjs"]
"breadboard.rl.harness.resources.qualification" = ["canonical_artifact_vectors_v1.json", "tls/authority.json", "tls/ca.cert.pem", "tls/server.cert.pem", "tls/server.key.pem"]
"breadboard_engine.execution" = ["node/*.mjs", "node/THIRD_PARTY_NOTICES.txt", "codex_139_models.json", "Cargo.toml", "Cargo.lock", "codex_patch/Cargo.toml", "codex_patch/main.rs", "codex_search/Cargo.toml", "codex_search/main.rs", "codex_image/Cargo.toml", "codex_image/main.rs"]
"breadboard_engine.compilation.context_builders" = ["assets/codex_0_139/*.md", "assets/codex_0_139/*.json"]
"breadboard_sdk.generated" = ["*.json"]
"config.product" = ["*.json"]
"config.e4_targets" = [
  "index.json", "notices/*.txt",
  "oh_my_pi/16.2.13*/*.json", "oh_my_pi/16.2.13*/*.yaml", "oh_my_pi/16.2.13*/*.txt", "oh_my_pi/16.2.13*/prompts/*.md",
  "oh_my_pi/18.1.17*/*.json", "oh_my_pi/18.1.17*/*.yaml", "oh_my_pi/18.1.17*/*.txt", "oh_my_pi/18.1.17*/prompts/*.md",
  "pi/0.57.1*/*.json", "pi/0.57.1*/*.yaml", "pi/0.57.1*/*.txt", "pi/0.57.1*/prompts/*.md",
  "pi/0.73.1*/*.json", "pi/0.73.1*/*.yaml", "pi/0.73.1*/*.txt", "pi/0.73.1*/prompts/*.md",
  "mini_swe_agent/2.4.6/*.json", "mini_swe_agent/2.4.6/*.yaml", "mini_swe_agent/2.4.6/*.txt", "mini_swe_agent/2.4.6/prompts/*.j2", "mini_swe_agent/2.4.6/prompts/*.md",
  "openhands_sdk/1.47.0/*.json", "openhands_sdk/1.47.0/*.yaml", "openhands_sdk/1.47.0/*.txt", "openhands_sdk/1.47.0/prompts/*.txt", "openhands_sdk/1.47.0/prompts/*.json", "openhands_sdk/1.47.0/prompts/*.md",
  "hermes_agent/2026.9.11*/*.json", "hermes_agent/2026.9.11*/*.yaml", "hermes_agent/2026.9.11*/*.txt", "hermes_agent/2026.9.11*/prompts/*.txt", "hermes_agent/2026.9.11*/prompts/*.json", "hermes_agent/2026.9.11*/fixtures/*.md", "hermes_agent/2026.9.11*/fixtures/fixture-code-style/*.md", "hermes_agent/2026.9.11*/fixtures/fixture-code-style/references/*.md",
  "openclaw/2026.9.4*/*.json", "openclaw/2026.9.4*/*.yaml", "openclaw/2026.9.4*/*.txt", "openclaw/2026.9.4*/bootstrap/*.md",
  "claude_code/2.1.63/*.yaml", "claude_code/2.1.63/prompts/*.md", "claude_code/2.1.63/refs/*.json",
  "oh_my_opencode/3.10.0/*.yaml", "oh_my_opencode/3.10.0/prompts/*.md", "oh_my_opencode/3.10.0/refs/*.mdx",
]
"conformance.comparators" = ["registry.json"]
"contracts.kernel" = ["*.json"]
"contracts.kernel.manifests" = ["*.json"]
"contracts.kernel.examples" = ["*.json"]
"contracts.kernel.registries" = ["*.json"]
"contracts.kernel.schemas" = ["*.schema.json"]
"contracts.kernel.schemas.payloads" = ["*.schema.json"]
"contracts.public" = ["*.json"]
"contracts.public.schemas" = ["*.schema.json"]
"contracts.internal.evidence" = ["operations.v1.json"]
"contracts.internal.evidence.schemas" = ["*.schema.json"]
"implementations" = ["THIRD_PARTY_NOTICES.txt"]
"implementations.tools.defs" = ["*.yaml"]
"implementations.tools.defs_codex_139" = ["*.yaml"]
"implementations.tools.defs_opencode_1_2_17" = ["*.yaml"]
"implementations.tools.defs_claude_code_2_1_63" = ["*.yaml"]
"implementations.tools.defs_omo_3_10_0" = ["*.yaml"]
"implementations.tools.defs_opencode_shared" = ["*.yaml"]
"implementations.prompts.todos" = ["*.md"]
"implementations.system_prompts" = ["*.md"]
"implementations.system_prompts.claude_code" = ["*.md"]
"implementations.system_prompts.guardrails" = ["*.md"]
"implementations.system_prompts.longrun" = ["*.md"]
"implementations.system_prompts.opencode" = ["*.md", "*.yaml"]
"implementations.tool_prompt_synthesis.opencode_patch" = ["*.md"]
"implementations.tool_prompt_synthesis.pythonic" = ["*.md"]
"implementations.tool_prompt_synthesis.unified_diff" = ["*.md"]

