# Oh My Pi E4 target-config projection
# Catalog refreshed 2026-09-10; upstream source remains the accepted 16.2.13 package at
# commit 5356713eae60e67ee64d9b02e3b5e377d248ee7f.
# Canonical machine authority: config/e4_targets/oh_my_pi/16.2.13/target.json
# Load with breadboard_engine.e4_targets.load_e4_target("oh-my-pi@16.2.13").
# Do not pass this target-config schema to the BreadBoard agent-config CLI.

schema_version: bb.e4.target_config.v1
target_id: oh-my-pi@16.2.13
prompt:
  renderer: oh-my-pi-handlebars-16.2.13
  asset: ../config/e4_targets/oh_my_pi/16.2.13/prompts/system-prompt.md
  dynamic_fields:
  - alwaysApplyRules
  - eagerTasks
  - eagerTasksAlways
  - hasMCPDiscoveryServers
  - hasMemoryRoot
  - hasObsidian
  - intentField
  - intentTracing
  - mcpDiscoveryMode
  - mcpDiscoveryServerSummaries
  - personality
  - renderMermaid
  - rules
  - secretsEnabled
  - skills
  - taskBatch
  - toolInfo
  - toolInventory
  - toolListMode
  - toolRefs
  - tools
tools:
  surface_asset: ../config/e4_targets/oh_my_pi/16.2.13/tool-surface.json
  normalization:
    search: grep
    find: glob
runtime:
  bun: '>=1.3.14'
