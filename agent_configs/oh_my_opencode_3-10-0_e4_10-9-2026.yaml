# Native OpenCode 1.2.17 plus oh-my-opencode 3.10.0 at 5137df72.
# Earlier dated profiles and immutable E4 target assets remain unchanged.
# oh-my-opencode E4 reference config
# Captured against oh-my-opencode 3.10.0 and calibrated on the Phase 8 async/subagent replay lane.
# Catalog refreshed 2026-09-10; the profile name below retains the capture-era date.
# Pinned stock/plugin supplies dynamic systems/catalogs and executes native tools.
# Local reference material lives under `../config/e4_targets/oh_my_opencode/3.10.0/`.
#
# +---------------------- oh-my-opencode dossier map ----------------------+
# | OpenCode-like prompt/tool substrate                                    |
# |   -> broader registry including background + slash/skill tools         |
# |   -> explicit multi-agent/team config                                  |
# |   -> async/subagent replay lane frozen in this public dossier          |
# +------------------------------------------------------------------------+
#
# Reading guide:
# - This is the public top-level oh-my-opencode dossier.
# - It is intentionally denser than OpenCode because the frozen public lane here is already
#   an async/subagent lane rather than just a baseline MVI lane.
# - The interesting parts are not only the tool catalog but also:
#   - background task primitives
#   - explicit team topology
#   - navigation between parent and child work
#   - broader slash/skill/LSP surfaces
# - In other words: this file should feel like an x-ray of a bigger harness, not just a replay tag.

version: 2
profile:
  name: oh-my-opencode-3.10.0-e4-2026-03-06
session:
  # prompt.ts:716-723 returns a failed assistant without deleting its native session.
  failed_turn_continues: true
workspace:
  # Like OpenCode, this stays direct-workspace at the public surface.
  # The async/subagent behavior comes from orchestration policy, not from workspace indirection.
  root: agent_ws_opencode
  mirror:
    enabled: false
    mode: development
providers:
  # This lane keeps the provider section intentionally boring so the reader can focus on the
  # thing that actually differentiates the harness here: the wider tool + subagent substrate.
  default_model: openai/gpt-5.1-codex-mini
  models:
  - id: openai/gpt-5.1-codex-mini
    max_input_tokens: 272000
    max_output_tokens: 32000
    adapter: openai
    params: {}
  # model-requirements.ts:15-149 and initialized stock /provider inventory.
  # Caps are transform.maxOutputTokens; missing native input limits stay missing.
  - id: openai/gpt-5.3-codex
    max_input_tokens: 272000
    max_output_tokens: 32000
    adapter: openai_responses
    params: {}
  - id: openai/gpt-5.2
    max_input_tokens: 272000
    max_output_tokens: 32000
    adapter: openai_responses
    params: {}
  - id: openai/gpt-5-nano
    max_input_tokens: 272000
    max_output_tokens: 32000
    adapter: openai_responses
    params: {}
  - id: opencode/minimax-m2.5-free
    max_output_tokens: 32000
    adapter: anthropic
    params: {}
  - id: opencode/gpt-5-nano
    max_input_tokens: 272000
    max_output_tokens: 32000
    adapter: openai_responses
    params: {}
  - id: opencode/big-pickle
    max_output_tokens: 32000
    adapter: anthropic
    params: {}
prompts:
  # The prompt model follows the OpenCode family pattern: durable system prompt, environment
  # context, and no ad hoc per-turn synthesized tool dump.
  tool_prompt_mode: system_compiled_and_persistent_per_turn
  packs:
    base:
      system: ../implementations/system_prompts/omo_3_10_0_sisyphus.prompt.md
      plan: ../config/e4_targets/oh_my_opencode/3.10.0/prompts/plan.md
      builder: ../config/e4_targets/oh_my_opencode/3.10.0/prompts/builder.md
  environment:
    enabled: true
    format: opencode
    file_limit: 200
    include_tree: false
    files_tag: directories
    include_model_identity: true
  tool_prompt_synthesis:
    enabled: false
  # Stock chat.message hooks transform the current input exactly once.
  initial_context:
    module: breadboard_engine.compilation.context_builders.opencode_stock
    callable: build_context
  summary_projection:
    module: breadboard_engine.compilation.context_builders.opencode_stock
    callable: build_summary_projection
  injection:
    system_order:
    - '@pack(base).system'
    per_turn_order: []
provider_tools:
  # Same general provider-native pattern as OpenCode, but with the more expansive
  # oh-my-opencode tool surface.
  #
  # The crucial difference from plain OpenCode is not here; it is lower in the config where the
  # tool registry and `multi_agent` surface become materially richer.
  use_native: true
  suppress_prompts: true
  api_variant: responses
  responses_use_developer_role: true
  tool_choice: auto
  responses_stateful: false
  # Native OpenCode transform.ts:688-695,720-722,759-763.
  openai:
    responses_stateful: false
    responses_use_developer_role: true
    tool_choice: auto
    responses_developer_content: string
    responses_group_tool_results: true
    responses_preserve_tool_call_items: true
    responses_max_output_tokens_from_context: true
    store: false
    reasoning: {effort: medium, summary: auto}
    session_params: {prompt_cache_key: '{session_id}'}
features:
  # The public async/subagent lane is frozen as a build-first lane, not a planning showcase.
  plan: false
  todos:
    enabled: false
    strict: false
    reset_streak_on_todo: true
completion:
  # Like OpenCode, this harness is willing to complete naturally without a dedicated finish tool.
  allow_zero_tool_completion: true
  append_response_marker: false
  build_guard:
    require_run_shell: false
    require_successful_tests: false
loop:
  # The loop is intentionally simple:
  #
  # +-------------------+
  # | build-only lane   |
  # +-------------------+
  #
  # The sophistication is not in stage count; it is in the subordinate/background tool surface.
  sequence:
  - mode: build
  plan_turn_limit: 0
modes:
- name: plan
  prompt: ''
  tools_enabled:
  - read_file
  - list_dir
  tools_disabled: []
- name: build
  prompt: ''
  tools_enabled:
  - '*'
  tools_disabled: []
tools:
  # Stock executes tool hooks once, including the category-skills reminder.
  native_semantics: oh_my_opencode_3_10_0
  group_native_calls_by_turn: true
  native_concurrent_prompts: true
  # The digest-pinned source sidecar runs in the local workspace process.
  native_local_only: true
  # Native bash/tmux may allocate a terminal through the admitted launch policy.
  pty: true
  stock_worktree_read_only: true
  stock_lsp_root:
    path: ~/.cache/bb-compaction-e4/pkgs/opencode-lsp-1.2.17
    digest: 2b27ba95b4a5f4968141f3c353f0e4abd8e1e9be1572b8e0d99292604ffa7478
  stock_plugin_root: ~/.cache/bb-compaction-e4/pkgs/oh-my-opencode@3.10.0-5137df72
  stock_read_only_roots:
  - path: ~/.cache/bb-compaction-e4/pkgs/opencode-darwin-arm64@1.2.17/package
    digest: 10c0bd72c60867d8ecdd37ba70a812076e1e8e2a9e5a3971ea4a728ebf4e836d
  - path: ~/.cache/bb-compaction-e4/pkgs/oh-my-opencode@3.10.0-5137df72
    digest: ec9c7f47c21ff078eb81231e0c0af22e8aea16b626e707f5e6d2fc128ae8e2dc
  - path: ~/.cache/bb-compaction-e4/pkgs/opencode-lsp-1.2.17
    digest: 2b27ba95b4a5f4968141f3c353f0e4abd8e1e9be1572b8e0d99292604ffa7478
  registry:
    # Exact pinned native/plugin tool names. Source runtime renders live descriptions.
    paths:
    - ../implementations/tools/defs_omo_3_10_0
    include:
    - question
    - bash
    - read
    - glob
    - grep
    - task
    - webfetch
    - todowrite
    - skill
    - apply_patch
    - lsp_goto_definition
    - lsp_find_references
    - lsp_symbols
    - lsp_diagnostics
    - lsp_prepare_rename
    - lsp_rename
    - ast_grep_search
    - ast_grep_replace
    - session_list
    - session_read
    - session_search
    - session_info
    - background_output
    - background_cancel
    - look_at
    - skill_mcp
    - interactive_bash
    - websearch_web_search_exa
    - grep_app_searchGitHub
    - context7_resolve-library-id
    - context7_query-docs
    #
    # This list is long on purpose. The file should let a reader grasp the public harness
    # surface at a glance:
    # - ordinary coding tools
    # - subagent/task tools
    # - background task primitives
    # - slash/skill helpers
    # - LSP and retrieval-style tools
    #
  aliases: {}
enhanced_tools:
  # The extra validation/diff layer is still visible here even though the headline feature of
  # this dossier is async/subagents. That matters because the public harness is not "just task()".
  enabled: true
  validation:
    enabled: false
    rules: []
    rule_config:
      one_bash_per_turn:
        turn_window_seconds: 120
      read_before_edit:
        mode: relaxed
        require_fresh_read: false
        max_age_seconds: 1800
  diff_policy:
    patch_splitting:
      policy: auto_split
      max_files_per_patch: 1
      validation_message: '<VALIDATION_ERROR>

        Multi-file patches are disabled in this configuration. Submit exactly one
        apply_unified_patch per file.

        </VALIDATION_ERROR>

        '
      on_violation: warn_and_split
guardrails:
  # Guardrails remain explicit even in the async/subagent lane so the reader can see
  # what is inherited from the execution baseline and what is deliberately relaxed.
  #
  # This section is especially important in a subagent-capable harness because it communicates
  # what remains centrally constrained even when work fans out to helpers.
  include:
  - ../implementations/guardrails/base_workspace.yaml
  - ../implementations/guardrails/execution_baseline.yaml
  overrides:
    zero_tool_watchdog:
      parameters:
        warn_after_turns: 8
        abort_after_turns: 20
    shell_write_block:
      templates:
        validation: ../implementations/system_prompts/guardrails/shell_write_block_opencode.prompt.md
      parameters:
        enabled: false
    todo_rate_limit:
      parameters:
        todo_updates_before_progress: 1
    completion_guard:
      parameters:
        warnings_before_abort: 6
    workspace_context:
      parameters:
        require_exploration_before_edit: false
        require_read_before_edit: false
        require_progress_before_todo_updates: false
    plan_bootstrap:
      strategy: never
  plan_bootstrap:
    strategy: soft
    max_turns: 2
    warmup_turns: 1
    seed_file: ../implementations/system_prompts/opencode/plan_bootstrap_protofs.yaml
permissions:
  # Like OpenCode, this is part of the public harness dossier rather than incidental detail.
  #
  # Because the tool surface is broader here, the permission block is also effectively the
  # public explanation of how that power stays bounded.
  #
  # The right mental model is:
  # - broad tool surface
  # - strong shell boundaries
  # - orchestration power comes from task/background tools, not from unconstrained shell access
  shell:
    default: allow
    allow:
    - ls*
    - pwd
    - cat*
    - head
    - tail
    - tree
    - git*
    - rg*
    - grep*
    - sed
    - awk
    - find
    - python*
    - pytest*
    - python*
    - pytest*
    - make
    - cmake*
    - npm run*
    - yarn run*
    - pnpm run*
    - go test*
    - cargo test*
    - uv run*
    - bash
    - sh
    - zsh
    ask:
    - npm install*
    - yarn add*
    - pnpm add*
    - pip install*
    - curl*
    - wget*
    - apt-get*
    - brew install*
    - uv pip install*
    - go install*
    - cargo install*
    - npm update*
    - yarn upgrade*
    deny:
    - rm *
    - rm -rf *
    - mv *
    - sudo *
    - chmod *
    - chown *
    - dd *
    - mkfs*
    - shutdown*
    - reboot*
    - kill *
    - pkill *
    - killall *
  edit:
    default: deny
  options:
    mode: auto_allow
turn_strategy:
  # Tool-role continuation is visible as part of the public harness feel: actions stream into
  # the transcript instead of being hidden behind a separate orchestration layer.
  flow: tool_role
multi_agent:
  # Unlike the current Codex dossier, this lane really is frozen on a subagent-capable replay.
  #
  # +---------------- main agent ----------------+
  # | delegates to read-only helpers            |
  # +-------------------+-----------------------+
  #                     |
  #         +-----------+-----------+
  #         v                       v
  #   repo-scanner             grep-summarizer
  #
  # The config refs below point at the exact BreadBoard helper configs used for those roles.
  #
  # Read this section as the heart of the public dossier:
  # - who can spawn whom
  # - whether async spawn is enabled
  # - how joins happen
  # - what the shared workspace policy is
  #
  # Also note what this section is *not*:
  # - it is not the same as `background_task`
  # - it is not the same as `call_omo_agent`
  #
  # Roughly:
  # - `task` / `multi_agent` = delegated conversational worker sessions
  # - `background_*`         = detached task handles the parent can poll/cancel
  # - `call_omo_agent`       = higher-level oh-my wrapper for agent dispatch
  enabled: true
  event_log_path: misc/multi_agent_runs/oh_my_opencode_phase8_async_event_log.jsonl
  team_config:
    team:
      id: oh_my_opencode_phase8_async
      version: 1
      agents:
        main:
          role: main
          config_ref: agent_configs/misc/oh_my_opencode_phase8_async_live.yaml
          entrypoint: true
        repo-scanner:
          role: repo-scanner
          config_ref: agent_configs/misc/opencode_phase8_subagent_readonly.yaml
          entrypoint: false
          capabilities:
            read_only: true
            allow_spawn: false
        grep-summarizer:
          role: grep-summarizer
          config_ref: agent_configs/misc/opencode_phase8_subagent_readonly.yaml
          entrypoint: false
          capabilities:
            read_only: true
            allow_spawn: false
      topology:
        edges:
        - from: main
          to: repo-scanner
          mode:
          - sync
        - from: main
          to: grep-summarizer
          mode:
          - sync
      orchestration:
        scheduler:
          kind: deterministic_event_loop
          max_concurrent_agents: 2
          # The scheduler stays small and deterministic in the frozen public lane so that the
          # replay evidence remains interpretable instead of devolving into nondeterministic noise.
        spawn_protocol:
          tool_name: task
          # This lane uses the OpenCode-family `task` surface rather than Codex-style
          # `spawn_agent`. That distinction is important and should be visible to a reader.
          async:
            enabled: false
            # This specific public lane is sync-join oriented even though the wider harness has
            # async/background primitives elsewhere in the tool surface.
        join_policy:
          default: block_until_complete
      coordination:
        # This stays additive and narrow: mission completion remains supervisor-owned, while
        # legacy completion ingress and timer-like wake conditions remain visible as compatibility.
        mission_owner_role: supervisor
        legacy_completion_sources:
        - text_sentinel
        - tool_call
        - provider_finish
        preserve_legacy_wake_conditions: true
        review:
          allowed_reviewer_roles:
          - supervisor
          - system
          no_progress_action: checkpoint
          retryable_failure_action: retry
        intervention:
          require_supervisor_escalate: true
          support_claim_limited_actions:
          - checkpoint
          - terminate
      bus:
        model_visible_topics:
        - tool_result
        retention:
          max_events: 2000
          max_age_seconds: 86400
      workspace:
        sharing:
          default: shared_readonly_subagents
          write_lock: main_only
replay:
  # The replay block names the specific tools whose outputs are contractually important for this
  # public lane. That is especially useful in async/subagent configs where not every event type
  # deserves equal weight.
  #
  # In practice this says: these are the tools whose behavior defines the public replay claim.
  compare_tool_outputs:
  - background_task
  - background_output
  - background_cancel
  - call_omo_agent
  fail_on_tool_output_mismatch: true

# Native context compaction, cloned from the pinned harness (docs/guides/CONTEXT_COMPACTION.md).
# Limits: same OpenCode 1.2.17 models.dev snapshot entry as the OpenCode profile
# (context 400000, input 272000, output capped at 32000).
compaction:
  enabled: true
  preset: oh-my-opencode@3.10.0
  contextWindow: 400000
