# Codex CLI 0.139.0 / GPT-5.5 production profile with native compaction.
# Source: a7dff904308535e965aee87680c1fc5ef1d19eec, models-manager/models.json.
# Long-session acceptance is recorded by scripts/compaction_lanes/codex_lane.py.

schema_version: bb.agent_config_surface.v2
version: 2

workspace:
  root: ./agent_ws
  sandbox:
    driver: process
  mirror:
    enabled: false
    path: ./agent_ws
    mode: development

# session/session.rs:520-529,1049-1052 rehydrates compacted history on resume.
resume:
  restore_compaction_state: true

providers:
  default_model: gpt-5.5
  # protocol/src/thread_id.rs:17-21 at a7dff904: production roots are UUIDv7.
  session_uuid_version: 7
  routing:
    disable_native_tools_on_probe_failure: true
    disable_stream_on_probe_failure: true
  models:
  - id: gpt-5.5
    adapter: openai
    params: {}
    # models-manager/models.json: gpt-5.5.truncation_policy.
    tool_output_truncation: {mode: tokens, limit: 10000}
    supports_image_detail_original: true
    web_search_tool_type: text_and_image

provider_tools:
  use_native: true
  suppress_prompts: true
  api_variant: responses
  openai:
    # core/src/client.rs:755-815; gpt-5.5 catalog's supported model capabilities.
    responses_stateful: false
    responses_message_type: true
    # protocol/src/models.rs:739-750,765; agent/control/spawn.rs:33-40.
    responses_message_phase: true
    # router.rs:98-110 and protocol/models.rs:869-878.
    responses_namespaces: true
    responses_hosted_outputs: [web_search_call]
    responses_custom_tools: [apply_patch]
    responses_tool_search: true
    responses_deferred_tools: [multi_agent_v1]
    # protocol/src/models.rs:793-806 preserves argument strings and namespace.
    responses_preserve_tool_call_items: true
    # protocol/src/models.rs:FunctionCallOutputContentItem preserves native image/text output.
    responses_tool_output_items: true
    include_reasoning: true
    request_params:
      parallel_tool_calls: true
      tool_choice: auto
      reasoning: {effort: medium}
      text: {verbosity: low}
      store: false
      include: [reasoning.encrypted_content]
    session_params:
      prompt_cache_key: "{session_id}"
    client_metadata_session:
      x-codex-installation-id: "{installation_id}"
      x-codex-window-id: "{session_id}:{compaction_boundary_count}"

prompts:
  packs:
    base:
      # models-manager/models.json: gpt-5.5 template with personality_pragmatic.
      system: ../breadboard_engine/compilation/context_builders/assets/codex_0_139/gpt55_instructions.md
      plan: ../breadboard_engine/compilation/context_builders/assets/codex_0_139/gpt55_instructions.md
      builder: ../breadboard_engine/compilation/context_builders/assets/codex_0_139/gpt55_instructions.md
      compact: ../breadboard_engine/compilation/context_builders/assets/codex_0_139/gpt55_instructions.md
      tools_catalog_full: ../breadboard_engine/compilation/context_builders/assets/codex_0_139/gpt55_instructions.md
      tools_catalog_short: ../breadboard_engine/compilation/context_builders/assets/codex_0_139/gpt55_instructions.md
  tool_prompt_mode: none
  # core/src/session/mod.rs:2752-2977: permissions/skills, then environment.
  initial_context:
    module: breadboard_engine.compilation.context_builders.codex
    callable: build_context
  tool_prompt_synthesis:
    enabled: false

# Native tool catalog and execution: core/src/tools/spec.rs at a7dff904.
tools:
  mark_task_complete: false
  native_semantics: codex_0_139
  registry:
    paths:
    - ../implementations/tools/defs_codex_139
    include:
    - exec_command
    - write_stdin
    - update_plan
    - request_user_input
    - apply_patch
    - view_image
    - get_goal
    - create_goal
    - update_goal
    - tool_search
    - web_search
    - multi_agent_v1
  aliases: {}
  dialects:
    preference:
      default:
      - aider_search_replace
      - unified_diff
      - bash_block
      by_model:
        openai/*:
          order:
          - aider_search_replace
          - unified_diff
          - bash_block
    selection:
      by_model:
        openai/*:
        - aider_search_replace
        - unified_diff

modes:
- name: plan
  prompt: '@pack(base).plan'
  tools_enabled:
  - read_file
  - list_dir
  - glob
  - grep
  tools_disabled: []
- name: build
  prompt: '@pack(base).builder'
  tools_enabled:
  - '*'
  tools_disabled: []
- name: compact
  prompt: '@pack(base).compact'
  tools_enabled: []

loop:
  sequence:
  - if: features.plan
    then:
      mode: plan
  - mode: build
  plan_turn_limit: 1
  turn_strategy:
    relay: tool_role
    flow: assistant_continuation
    allow_multiple_per_turn: true

long_running:
  enabled: false
  controller: longrun_v1
  reset_policy: fresh
  episode:
    max_steps_override: null
  queue:
    backend: todo_store
  reviewer:
    enabled: false
    mode: read_only
  resume:
    enabled: false
    state_path: meta/longrun_state.json
  verification:
    tiers: []
  recovery:
    no_progress_signature_repeats: 0
  budgets:
    wall_clock_s: 0
    total_episodes: 0
    total_tokens: 0
    total_cost_usd: 0.0

features:
  plan: false
  todos:
    enabled: false
    strict: false
    reset_streak_on_todo: true

completion:
  confidence_threshold: 0.6
  natural_finish:
    idle_turn_limit: 1
    no_tool_turns_threshold: 1
  primary: hybrid
  tool_finish: mark_task_complete
  provider_signals: true
  text_sentinels:
  - TASK COMPLETE
  - ALL TESTS PASSED
  - IMPLEMENTATION COMPLETE
  - '>>>>>> END RESPONSE'

concurrency:
  at_most_one_of:
  - exec_command
  groups: []
  nonblocking_tools: []

dossier:
  capture_scope:
    target: codex-cli 0.139.0
    model: gpt-5.5
    sandbox: read-only
    run_id: 20260630_codex_gpt55_capture_probe
    support_claim: docs/conformance/support_claims/codex_cli_gpt55_e4_capture_probe_v1_c4_support_claim.json
    exclusions:
    - write execution
    - collaboration and subagents
    - persistent terminal sessions
    - broad Codex parity

# Native context compaction, cloned from the pinned harness (docs/guides/CONTEXT_COMPACTION.md).
# Window: codex-rs/models-manager/models.json:19-24 (gpt-5.5 context_window 272000) at a7dff904.
# Trigger: 90% of the window (openai_models.rs:426-441); overflow is terminal.
compaction:
  enabled: true
  preset: codex@0.139.0
  contextWindow: 272000
