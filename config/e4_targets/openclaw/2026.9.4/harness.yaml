schema_version: bb.e4.target_config.v2
target_id: openclaw@2026.9.4
semantic_revision: bb.e4.openclaw-semantics.v1
renderer:
  selector: breadboard.openclaw.v1
  revision: breadboard.openclaw.2026.9.4
prompt:
  asset: prompts/system.j2
  dynamic_fields: [task, bootstrap_context]
tools:
  ordered: [ls, read, edit, write, exec, process]
  prompt_order: [read, write, edit, ls, exec, process]
  surface_asset: tool-surface.json
  optional_title: true
  normalization:
    aliases: {}
    legacy_edit_folding: true
policy:
  revision: bb.e4.target-policy.v2
  provider:
    api: native_chat_stream
    stream: true
    samples: 1
    provider_attempts: 1
    fallback: false
    compaction: false
    request_timeout_seconds: 45
  action:
    protocol: native_tools
    decoder: breadboard.openclaw.2026.9.4
    repair: null
    argument_processors: [edit_json_string, legacy_oldText_newText, path_xml_suffix]
    aliases: {}
    decode_entire_batch_before_dispatch: true
    require_terminal_finish_reason: true
    malformed: stop_before_recovery
  execution:
    scheduler: source_batch_parallel_with_source_order_commit
    history_commit: assistant_then_effects_then_tool_results
    terminal_policy: native_stop_or_error_or_budget
    bounded_controls:
      max_model_calls: 8
      episode_wall_seconds: 120
      model_request_seconds: 45
      single_tool_wall_seconds: 40
      max_tool_admissions: 32
      max_active_processes: 4
      exec_yield_ms: 10000
      process_poll_max_ms: 30000
  observations:
    preserve_raw_outcome: true
    preserve_model_render: true
    pending_delivery_ack_after_append: true
    commit_at_source_boundary: true
  authority:
    workspace_root: workspace
    containment: task_provided_isolated_substrate
    interaction: pipes_and_bounded_ptys
    network_tools: false
    subagents: false
  claim_exclusions:
  - gateway_service
  - durable_sessions
  - provider_retries
  - model_fallback
  - compaction
  - multimodal_model
  - network_tools
  - subagents
  - apply_patch
  - channels
inputs:
  revision: bb.e4.target-inputs.v2
  fields:
  - name: task
    required: true
    producer: runtime
    lifetime: episode
    source_ref: bb.rl.headless-run-request/prompt
    omission: required
    value_schema: {type: string}
  - name: model
    required: true
    producer: runtime
    lifetime: episode
    source_ref: headless_provider_route/model
    omission: required
    value_schema: {type: string}
  order: [task, model]
materialization:
  revision: bb.e4.target-materialization.v2
  assets:
  - {path: harness.yaml, role: config, required: true, source_ref: openclaw@3a9d69db/harness}
  - {path: prompts/system.j2, role: prompt, required: true, source_ref: src/agents/system-prompt.ts}
  - {path: tool-surface.json, role: tool_surface, required: true, source_ref: src/agents/core-coding-tools.ts}
  - {path: native-config.json, role: config, required: true, source_ref: src/commands/agent-exec.ts}
  - {path: bootstrap/AGENTS.md, role: bootstrap_fixture, required: true, source_ref: decision-15-answer}
  - {path: bootstrap/SOUL.md, role: bootstrap_fixture, required: true, source_ref: decision-15-answer}
  - {path: LICENSE.txt, role: license, required: true, source_ref: decision-15-answer}
  - {path: source.json, role: source, required: true, source_ref: 12_SOURCE_PINS.json}
  order: [harness.yaml, prompts/system.j2, tool-surface.json, native-config.json, bootstrap/AGENTS.md, bootstrap/SOUL.md, LICENSE.txt, source.json]
required_capabilities:
- native_action_processors.v1
- native_process_scope.required_all.v1
- provider_native_response.v1
- native_stream_consumer.v1
