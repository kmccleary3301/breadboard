schema: bb.compaction_preset.v1
id: oh-my-opencode@3.10.0
source:
  repo: https://github.com/code-yeongyu/oh-my-openagent
  commit: 5137df72d8fab3fec609c82f91387db8e3b13825
  evidence:
  - src/hooks/anthropic-context-window-limit-recovery/target-token-truncation.ts:26-196
  - src/hooks/compaction-context-injector/hook.ts:7-71
  - src/hooks/anthropic-context-window-limit-recovery/parser.ts:12-209
  - src/hooks/anthropic-context-window-limit-recovery/recovery-hook.ts:58-167
  - src/hooks/anthropic-context-window-limit-recovery/executor.ts:43-79
  - src/hooks/anthropic-context-window-limit-recovery/summarize-retry-strategy.ts:111-159
  - src/hooks/anthropic-context-window-limit-recovery/types.ts:31-43
claim: source_golden
native_settings:
  adapter: paths
  keys:
    compaction.auto:
    - triggers.0.enabled
    compaction.prune:
    - pipeline.stages.0.select.enabled
    compaction.reserved:
    - triggers.0.limit.reserved
    - target.threshold.reserved
    - target.manual.reserved
    - target.overflow.reserved
estimator: bb_chars4
triggers:
- kind: threshold
  accounting:
    kind: provider_total
    usage_total: total_or_components
    without_usage: skip
  limit:
    kind: input_or_window_reserve
    output_cap: 32000
    input_buffer: 20000
    reserved: null
  compare: '>='
  phase: assistant_step_end
  severity: soft
  enabled: true
  disable_zero_window: true
  provider_overflow: true
- kind: pending_error
  phase: assistant_step_end
  error_parser: breadboard_engine.compaction.oh_my_opencode:parse_token_limit_error
  skip_summary_last: true
  max_attempts: 2
target:
  threshold:
    kind: input_or_window_reserve
    output_cap: 32000
    input_buffer: 20000
    reserved: null
  manual:
    kind: input_or_window_reserve
    output_cap: 32000
    input_buffer: 20000
    reserved: null
  overflow:
    kind: input_or_window_reserve
    output_cap: 32000
    input_buffer: 20000
    reserved: null
overflow:
  max_attempts_per_turn: 1
  policy: compact
  error_classifier: breadboard_engine.compaction.opencode:is_context_overflow
request_view: []
pipeline:
  mode: sequence
  stages:
  - id: prune
    phase: user_turn_end
    when: {reasons: [request]}
    select:
      kind: protected_tool_outputs
      enabled: true
      protect_tokens: 40000
      protect_user_turns: 2
      min_savings: 20000
      exempt_tools:
      - skill
      stop_at_summary: true
      placeholder: '[Old tool result content cleared]'
    reduce:
      kind: mask_outputs
      placeholder: '[Old tool result content cleared]'
  - id: deferred_recovery
    when: {reasons: [threshold]}
    stop_on_detail: recovered
    select:
      kind: largest_first_masking
      target_ratio: 0.5
      chars_per_token: 4
      placeholder: '[TOOL RESULT TRUNCATED - Context limit exceeded. Original output was too large and has been truncated to recover the session. Please re-run this tool if you need the full output.]'
    reduce:
      kind: mask_outputs
      placeholder: '[TOOL RESULT TRUNCATED - Context limit exceeded. Original output was too large and has been truncated to recover the session. Please re-run this tool if you need the full output.]'
  - id: summary
    accept: any
    select:
      kind: whole_history
      exclude_latest_user_on:
      - overflow
      replay_min_users: 2
      replay_prefix_only: true
      exclude_compaction_users: true
    reduce:
      kind: message_summary
      system:
        file: ../opencode@1.2.17/system.txt
      prompt:
        file: ../opencode@1.2.17/summary.txt
      marker:
        file: ../opencode@1.2.17/marker.txt
      strip_media: true
      max_tokens: 32000
      # OpenCode compaction.ts:202-220 sends the complete converted history.
      request: {stream: true, stateless: true}
      contributors:
      - file: contributor.txt
    place:
      kind: summary_replay
      marker:
        file: ../opencode@1.2.17/marker.txt
      continuation:
        file: ../opencode@1.2.17/continue.txt
      overflow_prefix:
        file: ../opencode@1.2.17/overflow-prefix.txt
      auto_reasons:
      - threshold
      - overflow
