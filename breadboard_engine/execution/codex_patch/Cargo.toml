[package]
name = "breadboard-codex-patch"
version = "0.1.0"
edition = "2024"
publish = false

# Reuse the exact stock parser and patch engine, not a shell/PATH approximation.
[dependencies]
codex-apply-patch = { git = "https://github.com/openai/codex", rev = "a7dff904308535e965aee87680c1fc5ef1d19eec" }
codex-exec-server = { git = "https://github.com/openai/codex", rev = "a7dff904308535e965aee87680c1fc5ef1d19eec" }
codex-utils-absolute-path = { git = "https://github.com/openai/codex", rev = "a7dff904308535e965aee87680c1fc5ef1d19eec" }
codex-utils-output-truncation = { git = "https://github.com/openai/codex", rev = "a7dff904308535e965aee87680c1fc5ef1d19eec" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
shlex = "=1.3.0"

[[bin]]
name = "breadboard-codex-patch"
path = "main.rs"

# Cargo does not inherit dependency workspaces' root patches. These are the
# stock a7dff904 Cargo.toml:531-538 patches required by exec-server.
[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "132f5b39c862e3a970f731d709608b3e6276d5f6" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }
