[package]
name = "breadboard-codex-patch"
version = "0.1.0"
edition = "2024"
publish = false

# Reuse the exact stock parser and patch engine, not a shell/PATH approximation.
[dependencies]
codex-apply-patch = { git = "https://github.com/openai/codex", rev = "a7dff904308535e965aee87680c1fc5ef1d19eec" }
codex-exec-server = { git = "https://github.com/openai/codex", rev = "a7dff904308535e965aee87680c1fc5ef1d19eec" }
codex-utils-absolute-path = { git = "https://github.com/openai/codex", rev = "a7dff904308535e965aee87680c1fc5ef1d19eec" }
codex-utils-output-truncation = { git = "https://github.com/openai/codex", rev = "a7dff904308535e965aee87680c1fc5ef1d19eec" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
shlex = "=1.3.0"

[[bin]]
name = "breadboard-codex-patch"
path = "main.rs"

