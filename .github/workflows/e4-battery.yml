name: E4 Battery

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/e4_parity/**"
      - "tests/e4_parity/**"
      - "tests/rl/harness/test_pi_native_stream_conductor.py"
      - "tests/fixtures/pi_0_73_1_node/**"
      - "breadboard/rl/harness/pi_native_tools.py"
      - "breadboard/rl/harness/pi_tools_0_73_1.mjs"
      - "config/e4_targets/pi/0.73.1/**"
      - "contracts/kernel/**"
      - "config/e4_lanes/**"

jobs:
  e4-battery:
    name: e4-battery
    runs-on: ubuntu-latest
    env:
      BB_WORKSPACE_ROOT: ${{ github.workspace }}/..
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Bootstrap E4 battery environment
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Provision immutable E4 inputs
        run: python scripts/e4_parity/provision_immutable_inputs.py --repo-root "$GITHUB_WORKSPACE" --workspace-root "$GITHUB_WORKSPACE/.."

      - name: Verify exact 1000-point fixed-point regeneration
        run: python scripts/e4_parity/regen.py fixed-point --expected-points 1000 --expected-target-claims 10 --expected-non-target-claims 8 --json artifacts/conformance/e4_regen_fixed_point.json

      - name: Run full literal E4 parity battery
        run: pytest -q tests/e4_parity
  pi-native-stream:
    name: pi-native-stream
    runs-on: ubuntu-latest
    env:
      BB_WORKSPACE_ROOT: ${{ github.workspace }}/..
      PI_CODING_AGENT_NODE_MODULES: ${{ github.workspace }}/tests/fixtures/pi_0_73_1_node/node_modules
      BB_REQUIRE_PINNED_PI_NODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/fixtures/pi_0_73_1_node/package-lock.json

      - name: Install pinned Pi 0.73.1 dependencies
        working-directory: tests/fixtures/pi_0_73_1_node
        run: npm ci --ignore-scripts

      - name: Verify pinned Pi package and registry integrity
        working-directory: tests/fixtures/pi_0_73_1_node
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const expectedIntegrity = "sha512-gXQh3SaZmWTfVMc4Ao5+LGbVeKvzyO7tolok0nLsZgq9nGjZx/EEU3NM8C+qUnB4Nvs2rswG5qOVgLzQkq0fHQ==";
          const packageJson = JSON.parse(fs.readFileSync("node_modules/@mariozechner/pi-coding-agent/package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const entry = lock.packages["node_modules/@mariozechner/pi-coding-agent"];
          if (packageJson.version !== "0.73.1") throw new Error(`unexpected Pi version: ${packageJson.version}`);
          if (!entry || entry.integrity !== expectedIntegrity) throw new Error("Pi lock integrity does not match the pinned attachment");
          if (entry.resolved !== "https://registry.npmjs.org/@mariozechner/pi-coding-agent/-/pi-coding-agent-0.73.1.tgz") throw new Error("Pi lock does not resolve the registry tarball");
          NODE

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Bootstrap Python test environment
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run pinned Pi native-stream tests
        run: >-
          pytest -q
          tests/rl/harness/test_pi_native_stream_conductor.py
          tests/e4_parity/test_pi_0_73_1_prompt_materialization.py


  fixed-point-clean-checkout:
    name: Fixed-point clean checkout (${{ matrix.pass }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pass: [first, second]
    env:
      BB_WORKSPACE_ROOT: ${{ github.workspace }}/..
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Bootstrap E4 battery environment
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Provision immutable E4 inputs
        run: python scripts/e4_parity/provision_immutable_inputs.py --repo-root "$GITHUB_WORKSPACE" --workspace-root "$GITHUB_WORKSPACE/.."
      - name: Generate fixed-point report
        run: python scripts/e4_parity/regen.py fixed-point --expected-points 1000 --expected-target-claims 10 --expected-non-target-claims 8 --json artifacts/conformance/e4_regen_fixed_point_${{ matrix.pass }}.json
      - name: Materialize fixed-point watch-set entries
        run: |
          jq '{schema_version: "bb.e4.watch_set.v1", first_pass: .first_pass_watch_set, second_pass: .second_pass_watch_set}' \
            artifacts/conformance/e4_regen_fixed_point_${{ matrix.pass }}.json \
            > artifacts/conformance/e4_watch_set_${{ matrix.pass }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: e4-fixed-point-${{ matrix.pass }}
          path: |
            artifacts/conformance/e4_regen_fixed_point_${{ matrix.pass }}.json
            artifacts/conformance/e4_watch_set_${{ matrix.pass }}.json
          if-no-files-found: error

  fixed-point-clean-checkout-compare:
    name: Compare independent fixed-point checkouts
    needs: fixed-point-clean-checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: e4-fixed-point-first
          path: artifacts/first
      - uses: actions/download-artifact@v4
        with:
          name: e4-fixed-point-second
          path: artifacts/second
      - name: Compare clean-checkout reports byte-for-byte
        run: cmp artifacts/first/e4_regen_fixed_point_first.json artifacts/second/e4_regen_fixed_point_second.json
