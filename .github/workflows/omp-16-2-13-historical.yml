name: OMP 16.2.13 Historical

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  omp-16-2-13-historical:
    name: omp-16-2-13-historical
    runs-on: ubuntu-latest
    env:
      BB_WORKSPACE_ROOT: ${{ github.workspace }}/..
      OMP16213_CODING_AGENT_NODE_MODULES: ${{ github.workspace }}/tests/fixtures/omp_16_2_13_node/node_modules
      BB_REQUIRE_PINNED_OMP16213_NODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install pinned OMP 16.2.13 dependencies
        working-directory: tests/fixtures/omp_16_2_13_node
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify pinned OMP package and registry integrity
        working-directory: tests/fixtures/omp_16_2_13_node
        run: |
          bun run - <<'BUN'
          import fs from "node:fs";
          import lock from "./bun.lock";
          const expectedIntegrity = "sha512-ZKi9xul+Ef6wmq4VoETCmEFrAOOqx0Wq24MxHM6vL7al2NW/q7RCJc3StlLmHs8zN06C2tI/XQTMJbm5UDX0fA==";
          const packageJson = JSON.parse(fs.readFileSync("node_modules/@oh-my-pi/pi-coding-agent/package.json", "utf8"));
          const entry = lock.packages["@oh-my-pi/pi-coding-agent"];
          if (packageJson.version !== "16.2.13") throw new Error(`unexpected OMP version: ${packageJson.version}`);
          if (!entry || entry[entry.length - 1] !== expectedIntegrity) throw new Error("OMP lock integrity does not match the pinned attachment");
          if (entry[0] !== "@oh-my-pi/pi-coding-agent@16.2.13") throw new Error("OMP lock does not resolve the expected version");
          BUN

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Bootstrap Python test environment
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run pinned OMP 16.2.13 historical tests
        run: >-
          pytest -q
          tests/rl/harness/test_omp_16_2_13_*.py
          tests/e4_parity/test_omp_16_2_13_*.py
