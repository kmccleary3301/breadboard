name: E4 Target Drift Audit Nightly

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      snapshot_json:
        description: Optional closed snapshot path relative to the checkout
        required: false
        default: ""
        type: string

jobs:
  e4_target_drift_audit:
    name: E4 target drift audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Run E4 target drift audit
        run: |
          set -euo pipefail
          python scripts/research/parity/audit_e4_target_drift.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest config/e4_target_freeze_manifest.yaml \
            --json-out artifacts/e4_target_drift_live_head_report.json

      - name: Run E4 snapshot drift audit (when explicitly selected)
        env:
          SNAPSHOT_JSON: ${{ inputs.snapshot_json }}
        run: |
          set -euo pipefail
          if [[ -z "${SNAPSHOT_JSON:-}" ]]; then
            mkdir -p artifacts
            cat > artifacts/e4_target_drift_snapshot_report.json <<'JSON'
            {
              "comparison_source": "snapshot_json",
              "comparison_performed": false,
              "integrity_qualification": "not_performed",
              "skipped": true,
              "reason": "snapshot_not_configured",
              "drift_count": 0,
              "aligned_count": 0,
              "error_count": 0
            }
            JSON
            exit 0
          fi
          python scripts/research/parity/audit_e4_target_drift.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest config/e4_target_freeze_manifest.yaml \
            --snapshot-json "$SNAPSHOT_JSON" \
            --json-out artifacts/e4_target_drift_snapshot_report.json

      - name: Add drift audit summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def _load(path: str):
            p = Path(path)
            if not p.exists():
              return {"error": "report_not_written"}
            try:
              return json.loads(p.read_text(encoding="utf-8"))
            except Exception as exc:
              return {"error": f"report_unreadable: {exc}"}

          live = _load("artifacts/e4_target_drift_live_head_report.json")
          snap = _load("artifacts/e4_target_drift_snapshot_report.json")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if not summary_path:
            raise SystemExit(0)
          with open(Path(summary_path), "a", encoding="utf-8") as f:
            f.write("## E4 target drift audit\n\n")
            f.write(f"- live comparison source: `{live.get('comparison_source', 'n/a')}`\n")
            f.write(f"- live drift count: `{live.get('drift_count', 'n/a')}`\n")
            f.write(f"- live errors: `{live.get('error_count', 'n/a')}`\n")
            f.write(f"- snapshot comparison source: `{snap.get('comparison_source', 'n/a')}`\n")
            f.write(f"- snapshot drift count: `{snap.get('drift_count', 'n/a')}`\n")
            f.write(f"- snapshot errors: `{snap.get('error_count', 'n/a')}`\n")
            if snap.get("skipped"):
              f.write(f"- snapshot comparison: **not performed** (`{snap.get('reason', 'unknown')}`)\n")

      - name: Upload drift audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e4-target-drift-audit-report
          path: |
            artifacts/e4_target_drift_live_head_report.json
            artifacts/e4_target_drift_snapshot_report.json
          if-no-files-found: error
