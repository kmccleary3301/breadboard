name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-spine-checks:
    name: Product spine checks
    runs-on: ubuntu-latest
    env:
      BB_WORKSPACE_ROOT: ${{ github.workspace }}/..
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none

      - uses: ./.github/actions/main-seeded-cache
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: pip-${{ runner.os }}-${{ github.job }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-prefix: pip-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - uses: ./.github/actions/main-seeded-cache
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ github.job }}-${{ hashFiles('sdk/ts/package-lock.json') }}
          restore-prefix: npm-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bootstrap product-spine environment
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
          npm --prefix sdk/ts ci

      - name: Provision immutable E4 inputs
        run: python scripts/e4_parity/provision_immutable_inputs.py --repo-root "$GITHUB_WORKSPACE" --workspace-root "$GITHUB_WORKSPACE/.."

      - name: Verify catalog-generated public bindings
        run: |
          python scripts/quality/generate_public_bindings.py --check
          pytest -q tests/test_public_binding_codegen.py tests/test_public_binding_parity.py

      - name: Verify WS-A default-server SDK smokes
        env:
          BREADBOARD_PYTHON: python
        run: |
          python -m pytest -q tests/test_sdk_v1_default_server_smoke.py
          npm --prefix sdk/ts test

      - name: Verify E4 API surface
        run: pytest -q tests/test_e4_api_surface.py


      - name: Verify E4 validation and regeneration front door
        run: pytest -q tests/e4_parity/test_validate_lane.py tests/e4_parity/test_config_explanation.py tests/e4_parity/test_regen_front_door.py

      - name: Verify exported CLI bridge contracts are current
        run: |
          python scripts/release/export_cli_bridge_contracts.py
          git diff --exit-code docs/contracts/cli_bridge

      - name: Verify CLI bridge contract exports
        run: pytest -q tests/test_cli_bridge_contract_exports.py

      - name: Verify independent OpenAPI/full-server routes
        run: |
          python scripts/dev/generate_ts_sdk.py --check
          pytest -q tests/test_ts_sdk_codegen.py

      - name: Verify built Python and TypeScript artifacts
        run: |
          python -m pytest -q \
            tests/test_breadboard_cli_packaging.py::test_built_wheel_owns_runtime_resources_and_excludes_repository_debris \
            tests/test_breadboard_cli_packaging.py::test_built_wheel_clean_install_runs_public_surface_without_credentials \
            tests/product/harness/test_templates.py::test_wheel_import_loads_template_from_distribution_data_root
          npm --prefix sdk/ts run test:consumer

      - name: Script index guard (live-count report, not a cap)
        run: |
          python scripts/dev/build_script_index.py --check
          pytest -q tests/test_script_index_guard.py

      - name: Enforce Phase 20 freeze
        run: python scripts/check_phase20_freeze.py

  product-compilation:
    name: Product compilation
    runs-on: ubuntu-latest
    env:
      BB_WORKSPACE_ROOT: ${{ github.workspace }}/..
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none

      - uses: ./.github/actions/main-seeded-cache
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ github.job }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-prefix: pip-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bootstrap compilation environment
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Provision immutable E4 inputs
        run: python scripts/e4_parity/provision_immutable_inputs.py --repo-root "$GITHUB_WORKSPACE" --workspace-root "$GITHUB_WORKSPACE/.."

      - name: Verify compilation
        run: python -m pytest -q tests/compilation

  product-spine:
    name: product-spine
    needs:
      - product-spine-checks
      - product-compilation
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every product-spine lane
        env:
          PRODUCT_SPINE_CHECKS: ${{ needs.product-spine-checks.result }}
          PRODUCT_COMPILATION: ${{ needs.product-compilation.result }}
        run: |
          test "$PRODUCT_SPINE_CHECKS" = success
          test "$PRODUCT_COMPILATION" = success

  ci_guards:
    name: Consolidated CI guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0

      - uses: ./.github/actions/ci-guards
  conformance_matrix_sync_guard:
    name: Conformance matrix sync guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none

      - name: Check conformance matrix sync prerequisites
        id: conformance_matrix_sync_prereqs
        shell: bash
        run: |
          missing=0
          for p in \
            scripts/run_ct_scenarios.py \
            scripts/sync_conformance_matrix_status.py \
            tests/test_run_ct_scenarios.py \
            docs/conformance/ct_scenarios_v1.json \
            tests/test_sync_conformance_matrix_status.py \
            docs/conformance/CONFORMANCE_TEST_MATRIX_V1.csv; do
            if [ ! -f "$p" ]; then
              echo "missing prerequisite: $p"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/main-seeded-cache
        if: steps.conformance_matrix_sync_prereqs.outputs.ready == 'true'
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ github.job }}-${{ hashFiles('requirements.txt') }}
          restore-prefix: pip-${{ runner.os }}-

      - uses: actions/setup-python@v5
        if: steps.conformance_matrix_sync_prereqs.outputs.ready == 'true'
        with:
          python-version: "3.11"
      - name: Install dependencies
        if: steps.conformance_matrix_sync_prereqs.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Unit tests for CT rows + matrix sync
        if: steps.conformance_matrix_sync_prereqs.outputs.ready == 'true'
        run: |
          pytest -q \
            tests/test_run_ct_scenarios.py \
            tests/test_sync_conformance_matrix_status.py

      - name: Generate CT rows and sync matrix statuses
        if: steps.conformance_matrix_sync_prereqs.outputs.ready == 'true'
        run: |
          mkdir -p artifacts/conformance
          # This clean-checkout guard exercises scenarios whose commands consume
          # tracked checkout inputs. C4 chain validation is the existing
          # workspace-evidence capability: it remains directly addressable via
          # --test-id and fails closed without an immutable BB_WORKSPACE_ROOT.
          tracked_input_selection="$(
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path("docs/conformance/ct_scenarios_v1.json").read_text(encoding="utf-8"))
          scenarios = manifest["scenarios"]
          workspace_evidence = {
              scenario["test_id"]
              for scenario in scenarios
              if scenario.get("command", [None, None])[1:2] in (
                  ["scripts/validate_e4_c4_chain.py"],
                  ["scripts/e4_parity/validate_frozen_e4_evidence.py"],
              )
          }
          if "CT-P7-CODEX-GPT55-C4-CHAIN" not in workspace_evidence:
              raise SystemExit("workspace-evidence CT routing is stale: P7 C4 chain not classified")
          for scenario in scenarios:
              if scenario["test_id"] not in workspace_evidence:
                  print(scenario["test_id"])
          print(
              "clean-checkout CT scope records workspace-evidence scenarios as not_implemented: "
              + ", ".join(sorted(workspace_evidence)),
              file=sys.stderr,
          )
          PY
          )"
          if [[ -z "$tracked_input_selection" ]]; then
            echo "tracked-input CT classifier returned no scenarios; refusing fallback to the full manifest" >&2
            exit 1
          fi
          tracked_input_test_ids=()
          while IFS= read -r test_id; do
            tracked_input_test_ids+=("$test_id")
          done <<< "$tracked_input_selection"
          ct_filter_args=()
          for test_id in "${tracked_input_test_ids[@]}"; do
            ct_filter_args+=(--test-id "$test_id")
          done
          set +e
          python scripts/run_ct_scenarios.py \
            --json-out artifacts/conformance/ct_scenarios_result_v1.json \
            --rows-out artifacts/conformance/ct_scenarios_rows_v1.json \
            "${ct_filter_args[@]}"
          ct_exit=$?
          set -e
          python scripts/sync_conformance_matrix_status.py \
            --matrix-csv docs/conformance/CONFORMANCE_TEST_MATRIX_V1.csv \
            --rows-json artifacts/conformance/ct_scenarios_rows_v1.json \
            --out-csv artifacts/conformance/CONFORMANCE_TEST_MATRIX_V1.synced.csv \
            --summary-json artifacts/conformance/conformance_matrix_sync_summary_v1.json \
            --summary-md artifacts/conformance/conformance_matrix_sync_summary_v1.md
          python - "$ct_exit" <<'PY'
          import csv
          import json
          import sys
          from pathlib import Path
          ct_exit = int(sys.argv[1])
          result = json.loads(Path("artifacts/conformance/ct_scenarios_result_v1.json").read_text(encoding="utf-8"))
          summary = json.loads(Path("artifacts/conformance/conformance_matrix_sync_summary_v1.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("docs/conformance/ct_scenarios_v1.json").read_text(encoding="utf-8"))
          workspace_evidence = {
              scenario["test_id"]
              for scenario in manifest["scenarios"]
              if scenario.get("command", [None, None])[1:2] in (
                  ["scripts/validate_e4_c4_chain.py"],
                  ["scripts/e4_parity/validate_frozen_e4_evidence.py"],
              )
          }
          with Path("docs/conformance/CONFORMANCE_TEST_MATRIX_V1.csv").open(
              newline="", encoding="utf-8"
          ) as handle:
              matrix_rows = list(csv.DictReader(handle))
          matrix_ids = {row["test_id"] for row in matrix_rows}
          matrix_c4_ids = {
              row["test_id"]
              for row in matrix_rows
              if row.get("owner") == "capture-systems" and "-C4" in row["test_id"]
          }
          expected_missing = workspace_evidence & matrix_ids
          if matrix_c4_ids != expected_missing:
              raise SystemExit(
                  "matrix workspace-evidence membership mismatch: "
                  f"matrix_c4={sorted(matrix_c4_ids)} classified={sorted(expected_missing)}"
              )
          missing = set(summary.get("missing_test_ids", []))
          if missing != expected_missing:
              raise SystemExit(
                  "clean-checkout CT routing mismatch: "
                  f"expected matrix workspace-evidence rows={sorted(expected_missing)} "
                  f"missing={sorted(missing)}"
              )
          failing = int(summary.get("failing_rows", 0))
          blocking_not_implemented = int(summary.get("blocking_not_implemented_rows", 0))
          print(
              "conformance matrix sync guard: "
              f"ct_exit={ct_exit} ct_ok={result.get('ok')} sync_ok={summary.get('ok')} "
              f"failing_rows={failing} blocking_not_implemented_rows={blocking_not_implemented} "
              f"workspace_evidence_not_implemented={len(expected_missing)}"
          )
          if ct_exit != 0 or not result.get("ok", False) or not summary.get("ok", False):
              raise SystemExit(1)
          PY

      - name: Conformance matrix sync guard skipped (missing prerequisites)
        if: steps.conformance_matrix_sync_prereqs.outputs.ready != 'true'
        run: echo "Conformance matrix sync guard skipped on this branch."

      - name: Upload conformance matrix sync artifacts
        if: ${{ always() && steps.conformance_matrix_sync_prereqs.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: conformance-matrix-sync-guard-artifacts
          path: |
            artifacts/conformance/ct_scenarios_result_v1.json
            artifacts/conformance/ct_scenarios_rows_v1.json
            artifacts/conformance/CONFORMANCE_TEST_MATRIX_V1.synced.csv
            artifacts/conformance/conformance_matrix_sync_summary_v1.json
            artifacts/conformance/conformance_matrix_sync_summary_v1.md
          if-no-files-found: error


  extension_enabled_smoke:
    name: Extension-enabled smoke lane
    runs-on: ubuntu-latest
    env:
      BREADBOARD_EXTENSIONS_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none

      - name: Check extension-enabled prerequisites
        id: extension_enabled_prereqs
        shell: bash
        run: |
          missing=0
          for p in \
            scripts/run_atp_toy_loop_v1.py \
            scripts/run_evolake_minimal_campaign_v1.py \
            tests/test_atp_evolake_minimal_loops.py; do
            if [ ! -f "$p" ]; then
              echo "missing prerequisite: $p"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/main-seeded-cache
        if: steps.extension_enabled_prereqs.outputs.ready == 'true'
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ github.job }}-${{ hashFiles('requirements.txt') }}
          restore-prefix: pip-${{ runner.os }}-

      - uses: actions/setup-python@v5
        if: steps.extension_enabled_prereqs.outputs.ready == 'true'
        with:
          python-version: "3.11"
      - name: Install dependencies
        if: steps.extension_enabled_prereqs.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run extension-enabled ATP/EvoLake smoke checks
        if: steps.extension_enabled_prereqs.outputs.ready == 'true'
        run: |
          mkdir -p artifacts/atp_toy_loop_v1 artifacts/evolake_minimal_campaign_v1
          python scripts/run_atp_toy_loop_v1.py \
            --out artifacts/atp_toy_loop_v1/atp_toy_loop_report.ci.json \
            --artifacts-dir artifacts/atp_toy_loop_v1
          python scripts/run_evolake_minimal_campaign_v1.py \
            --generations 4 \
            --out artifacts/evolake_minimal_campaign_v1/evolake_minimal_campaign_report.ci.json \
            --artifacts-dir artifacts/evolake_minimal_campaign_v1 \
            --checkpoint artifacts/evolake_minimal_campaign_v1/checkpoint.ci.json
          pytest -q tests/test_atp_evolake_minimal_loops.py

      - name: Extension-enabled smoke lane skipped (missing prerequisites)
        if: steps.extension_enabled_prereqs.outputs.ready != 'true'
        run: echo "Extension-enabled smoke lane skipped on this branch."

      - name: Upload extension-lane artifacts
        if: ${{ always() && steps.extension_enabled_prereqs.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: extension-enabled-smoke-artifacts
          path: |
            artifacts/atp_toy_loop_v1/**
            artifacts/evolake_minimal_campaign_v1/**
          if-no-files-found: error

  compat_core:
    name: Compat core (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none

      - uses: ./.github/actions/main-seeded-cache
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ github.job }}-${{ hashFiles('requirements-core.txt', 'requirements.txt', 'pyproject.toml') }}
          restore-prefix: pip-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core dependencies
        run: |
          req_file="requirements-core.txt"
          if [ ! -f "$req_file" ]; then
            req_file="requirements.txt"
          fi
          python -m pip install -r "$req_file"

      - name: Check devx onboarding suite prerequisites
        id: devx_onboarding_prereqs
        shell: bash
        run: |
          missing=0
          for p in \
            Makefile \
            scripts/dev/bootstrap_first_time.sh \
            scripts/dev/check_onboarding_contract_drift.py \
            scripts/dev/devx_smoke.sh \
            scripts/dev/full_pass_validate.sh \
            scripts/dev/report_devx_timing.py \
            scripts/prune_breadboard_home.py; do
            if [ ! -f "$p" ]; then
              echo "missing prerequisite: $p"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Devx onboarding command-path suite (engine profile)
        if: steps.devx_onboarding_prereqs.outputs.ready == 'true'
        env:
          RAY_SCE_LOCAL_MODE: "1"
          OPENAI_API_KEY: compat-dummy
          ANTHROPIC_API_KEY: compat-dummy
          OPENROUTER_API_KEY: compat-dummy
        run: |
          mkdir -p artifacts/maintenance
          make onboarding-contract
          make setup-fast-engine
          make devx-smoke-engine
          make devx-full-pass-engine
          make devx-timing
          make disk-report
          python scripts/dev/report_devx_timing.py --json > artifacts/maintenance/devx_timing_summary.json

      - name: Devx onboarding command-path suite skipped (missing prerequisites)
        if: steps.devx_onboarding_prereqs.outputs.ready != 'true'
        run: echo "Devx onboarding suite skipped on this branch."

      - name: Upload devx onboarding artifacts
        if: ${{ always() && steps.devx_onboarding_prereqs.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: devx-onboarding-artifacts
          path: |
            artifacts/maintenance/devx_full_pass_latest.json
            artifacts/maintenance/devx_timing_summary.json
            artifacts/maintenance/prune_breadboard_home.latest.json
          if-no-files-found: error

      - name: Core install smoke
        run: python -c "import breadboard"

      - name: Check SDK guardrail prerequisites
        id: sdk_guardrail_prereqs
        shell: bash
        run: |
          if [ -f scripts/sdk_ci_guardrail.sh ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping SDK guardrail: missing scripts/sdk_ci_guardrail.sh"
          fi

      - name: SDK doctor + smoke guardrail
        if: steps.sdk_guardrail_prereqs.outputs.ready == 'true'
        env:
          RAY_SCE_LOCAL_MODE: "1"
          OPENAI_API_KEY: compat-dummy
          ANTHROPIC_API_KEY: compat-dummy
          OPENROUTER_API_KEY: compat-dummy
        run: bash scripts/sdk_ci_guardrail.sh agent_configs/misc/opencode_mock_c_fs.yaml

      - name: SDK doctor + smoke guardrail skipped (missing script)
        if: steps.sdk_guardrail_prereqs.outputs.ready != 'true'
        run: echo "SDK guardrail step skipped on this branch."

      - name: Check kernel import lint prerequisites
        id: kernel_import_lint_prereqs
        shell: bash
        run: |
          if [ -f tools/import_lint.py ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping kernel import lint: missing tools/import_lint.py"
          fi

      - name: Kernel import lint
        if: steps.kernel_import_lint_prereqs.outputs.ready == 'true'
        run: python tools/import_lint.py

      - name: Kernel import lint skipped (missing script)
        if: steps.kernel_import_lint_prereqs.outputs.ready != 'true'
        run: echo "Kernel import lint step skipped on this branch."

      - name: Check core compat suite prerequisites
        id: core_compat_prereqs
        shell: bash
        run: |
          missing=0
          for p in \
            tests/test_request_body_golden.py \
            tests/test_atp_route_gating.py \
            tests/test_provider_conformance_report.py; do
            if [ ! -f "$p" ]; then
              echo "missing prerequisite: $p"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Core compat suite
        if: steps.core_compat_prereqs.outputs.ready == 'true'
        env:
          RAY_SCE_LOCAL_MODE: "1"
          AGENT_SCHEMA_V2_ENABLED: "1"
          OPENAI_API_KEY: compat-dummy
          ANTHROPIC_API_KEY: compat-dummy
          OPENROUTER_API_KEY: compat-dummy
          BB_COMPAT_WORKSPACE_ROOT: /tmp/bb_compat_workspaces
        run: >
          python -m pytest -q
          tests/test_request_body_golden.py
          tests/test_tool_schema_golden.py
          tests/test_prompt_compilation_golden.py
          tests/test_ctrees_determinism_corpus.py
          tests/test_compat_break_guard_sim.py
          tests/test_compat_break_guard_ci_parity.py
          tests/test_compat_default_behavior_report.py
          tests/test_atp_route_gating.py
          tests/test_atp_repl_batch.py
          tests/test_atp_replay_fixtures.py
          tests/test_atp_vsock_protocol_conformance.py
          tests/test_atp_benchmark_drift_checker.py
          tests/test_atp_state_ref_regression_recovery.py
          tests/test_atp_state_ref_variance_report.py
          tests/test_state_store_lifecycle.py
          tests/test_firecracker_file_io_fallback.py
          tests/test_evolake_route_gating.py
          tests/test_extension_route_prefix_policy.py
          tests/test_extension_endpoint_enablement_matrix.py
          tests/test_feature_audit_contract_schema.py
          tests/test_plugin_loader.py
          tests/test_plugin_signing.py
          tests/test_plugin_manifest_malformed_fuzz.py
          tests/test_plugin_isolation_and_permissions.py
          tests/test_requirements_profiles.py
          tests/test_import_boundaries.py
          tests/test_kernel_imports.py
          tests/test_vsock_protocol.py
          tests/test_vsock_protocol_fallback.py
          tests/test_vsock_fixture_parity.py
          tests/test_vsock_envelope_policy.py
          tests/test_vsock_legacy_scope.py
          tests/test_firecracker_protocol_errors.py
          tests/test_firecracker_ci_opt_in_policy.py
          tests/test_atp_runbook_guardrails.py
          tests/test_pr_template_governance.py
          tests/test_otel_events_projection.py
          tests/test_export_otel_from_events_script.py
          tests/test_otlp_export.py
          tests/test_sdk_compat_bridges.py
          tests/test_export_bridge_views_script.py
          tests/test_orchestration_event_taxonomy.py
          tests/test_orchestration_scheduler_semantics.py
          tests/test_replay_derive.py
          tests/test_replay_eval_lane.py
          tests/test_replay_eval_lane_script.py
          tests/test_tui_engine_replay_bridge_scripts.py
          tests/test_provider_conformance_report.py

      - name: Core compat suite skipped (missing prerequisites)
        if: steps.core_compat_prereqs.outputs.ready != 'true'
        run: echo "Core compat suite skipped on this branch."

      - name: Extension-off invariants
        if: steps.core_compat_prereqs.outputs.ready == 'true'
        env:
          ATP_REPL_ENABLE: "1"
          ATP_REPL_ROUTE: "1"
        run: |
          cat > /tmp/extensions_off.yaml <<'YAML'
          extensions:
            atp:
              enabled: false
            evolake:
              enabled: false
          YAML
          export BREADBOARD_EXTENSIONS_CONFIG_PATH=/tmp/extensions_off.yaml
          python -m pytest -q \
            tests/test_atp_route_gating.py::test_atp_routes_explicitly_disabled_override_env \
            tests/test_evolake_route_gating.py::test_evolake_routes_explicitly_disabled_override_env \
            tests/test_feature_audit.py::test_feature_audit_defaults

      - name: Extension-off invariants skipped (missing prerequisites)
        if: steps.core_compat_prereqs.outputs.ready != 'true'
        run: echo "Extension-off invariants skipped on this branch."

      - name: Check compat governance artifact prerequisites
        id: compat_artifact_prereqs
        shell: bash
        run: |
          missing=0
          for p in \
            scripts/compat_surface_summary.py \
            scripts/compat_break_guard_sim.py \
            scripts/compat_default_behavior_report.py; do
            if [ ! -f "$p" ]; then
              echo "missing prerequisite: $p"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build compatibility governance artifacts
        if: steps.compat_artifact_prereqs.outputs.ready == 'true'
        run: |
          python scripts/compat_surface_summary.py --out artifacts/compat_surface_summary.json
          python scripts/compat_break_guard_sim.py --self-test --json-out artifacts/compat_break_guard_simulation.json
          python scripts/compat_default_behavior_report.py --out artifacts/compat_default_behavior_report.json

      - name: Build compatibility governance artifacts skipped (missing prerequisites)
        if: steps.compat_artifact_prereqs.outputs.ready != 'true'
        run: echo "Compatibility governance artifact generation skipped on this branch."

      - name: Upload compatibility governance artifacts
        if: ${{ always() && steps.compat_artifact_prereqs.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: compat-governance-artifacts
          path: |
            artifacts/compat_surface_summary.json
            artifacts/compat_break_guard_simulation.json
            artifacts/compat_default_behavior_report.json
          if-no-files-found: error

  compat_break_regen:
    name: Compat break regen guard
    if: >-
      ${{
        github.event_name == 'pull_request' && (
          contains(github.event.pull_request.labels.*.name, 'compat-break') ||
          contains(github.event.pull_request.labels.*.name, 'compat_break') ||
          contains(github.event.pull_request.labels.*.name, 'compat') ||
          contains(github.event.pull_request.body || '', '[x] **Compat break**') ||
          contains(github.event.pull_request.body || '', '[x] Compat break') ||
          contains(github.event.pull_request.body || '', '[X] **Compat break**') ||
          contains(github.event.pull_request.body || '', '[X] Compat break')
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none

      - uses: ./.github/actions/main-seeded-cache
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ github.job }}-${{ hashFiles('requirements-core.txt', 'requirements.txt', 'pyproject.toml') }}
          restore-prefix: pip-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core dependencies
        run: |
          req_file="requirements-core.txt"
          if [ ! -f "$req_file" ]; then
            req_file="requirements.txt"
          fi
          python -m pip install -r "$req_file"

      - name: Regenerate request-body fixtures
        env:
          RAY_SCE_LOCAL_MODE: "1"
          AGENT_SCHEMA_V2_ENABLED: "1"
          OPENAI_API_KEY: compat-dummy
          ANTHROPIC_API_KEY: compat-dummy
          OPENROUTER_API_KEY: compat-dummy
          BB_COMPAT_WORKSPACE_ROOT: /tmp/bb_compat_workspaces
        run: python scripts/compat_dump_request_bodies.py

      - name: Ensure fixtures checked in
        run: git diff --exit-code tests/fixtures/compat/request_bodies

  firecracker_atp:
    name: ATP Firecracker (self-hosted)
    if: ${{ vars.ATP_FIRECRACKER_SMOKE == '1' }}
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none

      - uses: ./.github/actions/main-seeded-cache
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ github.job }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-prefix: pip-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Snapshot preflight (firecracker ATP)
        env:
          FIRECRACKER_SNAPSHOT: ${{ vars.FIRECRACKER_SNAPSHOT }}
          FIRECRACKER_SNAPSHOT_DIRS: ${{ vars.FIRECRACKER_SNAPSHOT_DIRS }}
        run: python scripts/atp_snapshot_preflight.py --json

      - name: Run Firecracker ATP smoke + bench
        env:
          FIRECRACKER_SNAPSHOT: ${{ vars.FIRECRACKER_SNAPSHOT }}
          FIRECRACKER_SNAPSHOT_MEM: ${{ vars.FIRECRACKER_SNAPSHOT_MEM }}
          FIRECRACKER_SNAPSHOT_VSOCK: ${{ vars.FIRECRACKER_SNAPSHOT_VSOCK }}
          FIRECRACKER_ROOTFS: ${{ vars.FIRECRACKER_ROOTFS }}
          FIRECRACKER_BIN: ${{ vars.FIRECRACKER_BIN }}
          FIRECRACKER_VSOCK_PORT: ${{ vars.FIRECRACKER_VSOCK_PORT }}
          BUDGET_P95_MS: ${{ vars.ATP_REPL_BUDGET_P95_MS }}
          ITERS: ${{ vars.ATP_REPL_BENCH_ITERS }}
          ATP_REPL_BENCH_VALIDATE: ${{ vars.ATP_REPL_BENCH_VALIDATE || '1' }}
          ATP_REPL_BENCH_SUMMARY_PATH: ${{ vars.ATP_REPL_BENCH_SUMMARY_PATH }}
          ATP_REPL_LOAD_VALIDATE: ${{ vars.ATP_REPL_LOAD_VALIDATE || '1' }}
          ATP_REPL_LOAD_CONCURRENCY: ${{ vars.ATP_REPL_LOAD_CONCURRENCY }}
          ATP_REPL_LOAD_ITERS: ${{ vars.ATP_REPL_LOAD_ITERS }}
          ATP_REPL_LOAD_SUMMARY_PATH: ${{ vars.ATP_REPL_LOAD_SUMMARY_PATH }}
          ATP_SNAPSHOT_POOL_PROBE: ${{ vars.ATP_SNAPSHOT_POOL_PROBE || '0' }}
          ATP_SNAPSHOT_POOL_MIN_HEALTHY: ${{ vars.ATP_SNAPSHOT_POOL_MIN_HEALTHY || '1' }}
        run: bash scripts/atp_firecracker_ci.sh

  tui_contract_harness:
    needs: select_affected_tests
    if: ${{ !cancelled() && (needs.select_affected_tests.result != 'success' || contains(fromJSON(needs.select_affected_tests.outputs.node_targets || '[]'), 'tui_skeleton')) }}
    name: Legacy TUI contract harness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none

      - uses: ./.github/actions/main-seeded-cache
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ github.job }}-${{ hashFiles('tui_skeleton/package-lock.json', 'sdk/ts/package-lock.json', 'sdk/ts-kernel-contracts/package-lock.json') }}
          restore-prefix: npm-${{ runner.os }}-

      - uses: ./.github/actions/main-seeded-cache
        if: ${{ matrix.os == 'ubuntu-latest' }}
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ github.job }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-prefix: pip-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        if: ${{ matrix.os == 'ubuntu-latest' }}
        with:
          python-version: "3.11"

      - name: Build kernel contracts package
        working-directory: sdk/ts-kernel-contracts
        run: |
          npm ci
          npm run build

      - name: Build canonical SDK package
        working-directory: sdk/ts
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        working-directory: tui_skeleton
        run: npm ci

      - name: Install product-server dependencies (ubuntu only)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: python -m pip install -r requirements.txt

      - name: Typecheck
        working-directory: tui_skeleton
        run: npm run typecheck

      - name: Unit tests
        working-directory: tui_skeleton
        env:
          BREADBOARD_TUI_PRODUCT_SMOKE: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
        run: npm test

      - name: Runtime gate suite (strict, ubuntu only)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        working-directory: tui_skeleton
        run: npm run runtime:gates:strict

      - name: Runtime gate artifacts (ubuntu only)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        working-directory: tui_skeleton
        run: |
          mkdir -p ../artifacts/runtime_gates
          cat > ../artifacts/runtime_gates/jitter_baseline.json <<'JSON'
          ["x\ny\nz", "x\nY\nz"]
          JSON
          cat > ../artifacts/runtime_gates/jitter_candidate.json <<'JSON'
          ["x\ny\nz", "x\ny\nz\nw"]
          JSON
          npm run runtime:gate:jitter -- \
            --baseline ../artifacts/runtime_gates/jitter_baseline.json \
            --candidate ../artifacts/runtime_gates/jitter_candidate.json \
            --strict \
            --out ../artifacts/runtime_gates/jitter_gate.json
          npm run runtime:gate:noise -- \
            --fixture src/commands/repl/__tests__/fixtures/multi_turn_interleave.jsonl \
            --threshold 2 \
            --strict \
            --out ../artifacts/runtime_gates/noise_gate.json
          npm run runtime:gate:noise:matrix -- \
            --fixtures src/commands/repl/__tests__/fixtures/tool_call_result.jsonl,src/commands/repl/__tests__/fixtures/multi_turn_interleave.jsonl \
            --threshold 100 \
            --strict \
            --out ../artifacts/runtime_gates/noise_matrix.json
          npm run runtime:gate:dashboard -- \
            --artifacts ../artifacts/runtime_gates \
            --strict-tests-ok \
            --strict \
            --out ../artifacts/runtime_gates/dashboard.json \
            --markdown-out ../artifacts/runtime_gates/dashboard.md

      - name: Subagents runtime bundle (ubuntu only)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        working-directory: tui_skeleton
        run: |
          mkdir -p ../artifacts/subagents_bundle
          npm run subagents:bundle -- \
            --out ../artifacts/subagents_bundle/summary.json \
            --markdown-out ../artifacts/subagents_bundle/summary.md

      - name: Runtime gate summary (ubuntu only)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          if [ -f artifacts/runtime_gates/dashboard.md ]; then
            cat artifacts/runtime_gates/dashboard.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Runtime Gate Dashboard" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "missing artifacts/runtime_gates/dashboard.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/subagents_bundle/summary.md ]; then
            cat artifacts/subagents_bundle/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Subagents Runtime Bundle" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "missing artifacts/subagents_bundle/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/subagents_rollback/summary.md ]; then
            cat artifacts/subagents_rollback/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Subagents Rollback Validation" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "missing artifacts/subagents_rollback/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: TUI goldens (report-only)
        working-directory: tui_skeleton
        run: npm run tui:goldens:report

      - name: TUI goldens (report-only) summary (ubuntu only)
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        run: |
          python - <<'PY'
          import glob, json, os

          def append(lines):
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as out:
                      out.write("\n".join(lines) + "\n")
              print("\n".join(lines))

          paths = sorted(glob.glob("misc/tui_goldens/artifacts/run-*/_diffs/index.json"))
          if not paths:
              append(["### TUI goldens report-only", "", "- missing `misc/tui_goldens/artifacts/run-*/_diffs/index.json`", ""])
              raise SystemExit(0)

          p = paths[-1]
          with open(p, "r", encoding="utf-8") as f:
              data = json.load(f)

          total = int(data.get("okCount", 0)) + int(data.get("failCount", 0))
          append(
              [
                  "### TUI goldens report-only",
                  "",
                  f"- run: `{p.split('/_diffs/')[0]}`",
                  f"- scenarios: `{total}`",
                  f"- ok: `{data.get('okCount', 0)}`",
                  f"- fail: `{data.get('failCount', 0)}`",
                  f"- missing_blessed: `{data.get('missingBlessed', 0)}`",
                  f"- missing_candidate: `{data.get('missingCandidate', 0)}`",
                  f"- diff index: `{p}`",
                  "",
              ]
          )
          PY

      - name: Claude alignment (report-only)
        working-directory: tui_skeleton
        run: npm run claude:compare:report

      - name: Tier-1 UI baselines (strict gate, ubuntu only)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        working-directory: tui_skeleton
        run: |
          unset NO_COLOR || true
          export BREADBOARD_ASCII=0
          export BREADBOARD_TUI_PRESET=breadboard_default
          node --import tsx scripts/tui_u1_goldens_strict.ts
          node --import tsx scripts/tui_u2_goldens_strict.ts
          node --import tsx scripts/tui_u3_goldens_strict.ts

      - name: Tier-1 UI baselines summary (ubuntu only)
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        run: |
          python - <<'PY'
          import glob, json, os

          def append(lines):
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as out:
                      out.write("\n".join(lines) + "\n")
              print("\n".join(lines))

          def summarize_lane(lane: str):
              try:
                  paths = sorted(glob.glob(f"tui_skeleton/ui_baselines/{lane}/_runs/run-*/_diffs/index.json"))
                  if not paths:
                      append(
                          [
                              f"### Tier-1 {lane} strict",
                              "",
                              f"- missing `tui_skeleton/ui_baselines/{lane}/_runs/run-*/_diffs/index.json`",
                              "",
                          ]
                      )
                      return

                  p = paths[-1]
                  with open(p, "r", encoding="utf-8") as f:
                      data = json.load(f)

                  total = int(data.get("okCount", 0)) + int(data.get("failCount", 0))
                  append(
                      [
                          f"### Tier-1 {lane} strict",
                          "",
                          f"- run: `{p.split('/_diffs/')[0]}`",
                          f"- scenarios: `{total}`",
                          f"- ok: `{data.get('okCount', 0)}`",
                          f"- fail: `{data.get('failCount', 0)}`",
                          f"- missing_blessed: `{data.get('missingBlessed', 0)}`",
                          f"- missing_candidate: `{data.get('missingCandidate', 0)}`",
                          f"- diff index: `{p}`",
                          "",
                      ]
                  )
              except Exception as e:
                  append([f"### Tier-1 {lane} strict", "", f"- summary error: `{type(e).__name__}: {e}`", ""])

          summarize_lane("u1")
          summarize_lane("u2")
          summarize_lane("u3")
          PY

      - name: Upload TUI golden artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tui-goldens-${{ matrix.os }}
          path: |
            misc/tui_goldens/artifacts/run-*/**
            tui_skeleton/ui_baselines/u1/_runs/run-*/**
            tui_skeleton/ui_baselines/u2/_runs/run-*/**
            tui_skeleton/ui_baselines/u3/_runs/run-*/**
          if-no-files-found: ignore

      - name: Upload Claude alignment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-compare-${{ matrix.os }}
          path: |
            misc/tui_goldens/claude_compare/run-*/**
          if-no-files-found: ignore

      - name: Upload runtime gate artifacts
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-gates-${{ matrix.os }}
          path: |
            artifacts/runtime_gates/**
            artifacts/subagents_bundle/**
            artifacts/subagents_rollback/**
          if-no-files-found: ignore

      - name: Build
        working-directory: tui_skeleton
        run: npm run build

      - name: Legacy contract harness smoke (--help)
        working-directory: tui_skeleton
        run: node dist/main.js --help


  live_smoke:
    name: Live smoke (ubuntu)
    runs-on: ubuntu-latest
