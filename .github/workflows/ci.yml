  vscode_sidebar_e2e:
    needs: select_affected_tests
    if: ${{ !cancelled() && (needs.select_affected_tests.result != 'success' || contains(fromJSON(needs.select_affected_tests.outputs.node_targets || '[]'), 'vscode_sidebar')) }}
    name: VSCode Sidebar E2E (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none

      - uses: ./.github/actions/main-seeded-cache
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ github.job }}-${{ hashFiles('vscode_sidebar/package-lock.json') }}
          restore-prefix: npm-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install sidebar dependencies
        working-directory: vscode_sidebar
        run: npm ci

      - name: Sidebar typecheck
        working-directory: vscode_sidebar
        run: npm run typecheck

      - name: Sidebar unit tests
        working-directory: vscode_sidebar
        run: npm run test

      - name: Check sidebar IDE E2E prerequisites
        id: vscode_sidebar_ide_e2e_prereqs
        working-directory: vscode_sidebar
        shell: bash
        run: |
          missing=0
          node - <<'JS' || missing=1
          const pkg = require('./package.json');
          if (!pkg.scripts || !pkg.scripts['ide-e2e:pr']) {
            console.log('missing prerequisite: package script ide-e2e:pr');
            process.exit(1);
          }
          JS
          if [ ! -f scripts/assert_ide_e2e_summary.mjs ]; then
            echo "missing prerequisite: scripts/assert_ide_e2e_summary.mjs"
            missing=1
          fi
          if [ "$missing" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sidebar IDE E2E (PR suite)
        if: steps.vscode_sidebar_ide_e2e_prereqs.outputs.ready == 'true'
        working-directory: vscode_sidebar
        run: npm run ide-e2e:pr

      - name: Assert PR suite summary is clean
        if: steps.vscode_sidebar_ide_e2e_prereqs.outputs.ready == 'true'
        working-directory: vscode_sidebar
        run: node scripts/assert_ide_e2e_summary.mjs --suite pr --editor vscode

      - name: Sidebar IDE E2E skipped (missing prerequisites)
        if: steps.vscode_sidebar_ide_e2e_prereqs.outputs.ready != 'true'
        run: echo "Sidebar IDE E2E skipped on this branch."

      - name: Upload sidebar ide-e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-sidebar-ide-e2e
          path: docs_tmp/interfaces/ide_e2e_runs/run-*
          if-no-files-found: ignore

  select_affected_tests:
    name: Test selector regression and selection
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.selector.outcome == 'success' && steps.selector.outputs.full || steps.safe_defaults.outputs.full }}
      python: ${{ steps.selector.outcome == 'success' && steps.selector.outputs.python || steps.safe_defaults.outputs.python }}
      node_targets: ${{ steps.selector.outcome == 'success' && steps.selector.outputs.node_targets || steps.safe_defaults.outputs.node_targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0

      - name: Set safe full-suite defaults
        if: always()
        id: safe_defaults
        shell: bash
        run: |
          echo "full=true" >> "$GITHUB_OUTPUT"
          echo "python=true" >> "$GITHUB_OUTPUT"
          echo 'node_targets=["sdk/ts","sdk/ts-backbone","sdk/ts-execution-driver-local","sdk/ts-execution-driver-oci","sdk/ts-execution-driver-remote","sdk/ts-execution-drivers","sdk/ts-host-bridges","sdk/ts-host-kits","sdk/ts-host-t3","sdk/ts-kernel-contracts","sdk/ts-kernel-core","sdk/ts-orchestration-temporal","sdk/ts-transport-ai-sdk","sdk/ts-workspace","tui_skeleton","vscode_sidebar"]' >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/main-seeded-cache
        if: always()
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ github.job }}-${{ hashFiles('requirements.txt') }}
          restore-prefix: pip-${{ runner.os }}-

      - name: Set up Python
        if: always()
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install selector regression dependency
        if: always()
        continue-on-error: true
        run: python -m pip install pytest

      - name: Run selector regression unconditionally
        if: always()
        id: selector_regression
        continue-on-error: true
        run: python -m pytest -q tests/test_ci_test_selection.py

      - name: Select affected tests
        if: ${{ github.event_name == 'pull_request' && steps.selector_regression.outcome == 'success' }}
        id: selector
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/ci/select_tests.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Require selector proof and selection
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          REGRESSION_RESULT: ${{ steps.selector_regression.outcome }}
          SELECTION_RESULT: ${{ steps.selector.outcome }}
        shell: bash
        run: |
          test "$REGRESSION_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$SELECTION_RESULT" = success
          fi


  python:
    name: Python (${{ matrix.os }})
    needs: select_affected_tests
    if: ${{ always() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none

      - uses: ./.github/actions/main-seeded-cache
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ github.job }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-prefix: pip-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install optional MCP dependency (for smokes)
        run: python -m pip install mcp

      - name: Verify exported CLI bridge contracts are up-to-date
        run: |
          python scripts/release/export_cli_bridge_contracts.py
          git diff --exit-code docs/contracts/cli_bridge

      - name: Check targeted test prerequisites
        id: python_targeted_test_prereqs
        shell: bash
        run: |
          missing=0
          for p in \
            tests/test_cli_bridge_contract_exports.py \
            tests/test_policy_pack_enforcement.py \
            tests/test_permission_rule_persistence.py \
            tests/test_cli_bridge_checkpoint_commands.py \
            tests/test_plugin_loader.py \
            tests/test_skills_registry.py \
            tests/test_mcp_manager.py \
            tests/test_atp_snapshot_preflight.py \
            tests/test_snapshot_dirs.py \
            tests/test_atp_firecracker_repl_load_snapshot_dirs.py \
            tests/test_feature_audit_contract_schema.py \
            tests/test_atp_snapshot_dir_validation.py \
            tests/test_atp_snapshot_pool_health.py \
            tests/test_atp_snapshot_pool_locks.py \
            tests/test_atp_snapshot_pool_builder.py \
            tests/test_atp_snapshot_pool_stability.py \
            tests/test_atp_ops_digest.py \
            tests/test_atp_seven_day_stability_report.py \
            tests/test_atp_threshold_policy.py \
            tests/test_atp_runbook_commands.py \
            tests/test_atp_artifact_validation.py \
            tests/test_atp_benchmark_drift_checker.py \
            tests/test_atp_state_ref_variance_report.py \
            tests/test_promote_atp_state_ref_baseline.py \
            tests/test_firecracker_file_io_fallback.py \
            tests/test_evolake_route_gating.py \
            tests/test_evolake_tools.py \
            tests/test_evolake_campaign_route.py; do
            if [ ! -f "$p" ]; then
              echo "missing prerequisite: $p"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Targeted tests
        if: ${{ always() && steps.python_targeted_test_prereqs.outputs.ready == 'true' && (github.event_name != 'pull_request' || needs.select_affected_tests.result != 'success' || needs.select_affected_tests.outputs.full == 'true' || needs.select_affected_tests.outputs.python == 'true') }}
        run: >
          python -m pytest -q
          tests/test_cli_bridge_contract_exports.py
          tests/test_policy_pack_enforcement.py
          tests/test_permission_rule_persistence.py
          tests/test_cli_bridge_checkpoint_commands.py
          tests/test_plugin_loader.py
          tests/test_skills_registry.py
          tests/test_mcp_manager.py
          tests/test_atp_snapshot_preflight.py
          tests/test_snapshot_dirs.py
          tests/test_atp_firecracker_repl_load_snapshot_dirs.py
          tests/test_feature_audit_contract_schema.py
          tests/test_atp_snapshot_dir_validation.py
          tests/test_atp_snapshot_pool_health.py
          tests/test_atp_snapshot_pool_locks.py
          tests/test_atp_snapshot_pool_builder.py
          tests/test_atp_snapshot_pool_stability.py
          tests/test_atp_ops_digest.py
          tests/test_atp_seven_day_stability_report.py
          tests/test_atp_threshold_policy.py
          tests/test_atp_runbook_commands.py
          tests/test_atp_artifact_validation.py
          tests/test_atp_benchmark_drift_checker.py
          tests/test_atp_state_ref_variance_report.py
          tests/test_promote_atp_state_ref_baseline.py
          tests/test_firecracker_file_io_fallback.py
          tests/test_evolake_route_gating.py
          tests/test_evolake_tools.py
          tests/test_evolake_campaign_route.py

      - name: Targeted tests skipped (missing prerequisites)
        if: ${{ always() && steps.python_targeted_test_prereqs.outputs.ready != 'true' }}
        run: echo "Targeted tests skipped on this branch."

      - name: Check stream chaos prerequisites
        id: stream_chaos_prereqs
        shell: bash
        run: |
          missing=0
          for p in \
            tests/test_cli_backend_streaming.py \
            tests/test_cli_bridge_eventlog.py; do
            if [ ! -f "$p" ]; then
              echo "missing prerequisite: $p"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stream chaos suite
        if: ${{ always() && steps.stream_chaos_prereqs.outputs.ready == 'true' && (github.event_name != 'pull_request' || needs.select_affected_tests.result != 'success' || needs.select_affected_tests.outputs.full == 'true' || needs.select_affected_tests.outputs.python == 'true') }}
        run: |
          mkdir -p artifacts/stream_chaos
          python -m pytest -q \
            tests/test_cli_backend_streaming.py \
            tests/test_cli_bridge_eventlog.py \
            --junitxml artifacts/stream_chaos/pytest.xml

      - name: Stream chaos suite skipped (missing prerequisites)
        if: ${{ always() && github.event_name != 'pull_request' && steps.stream_chaos_prereqs.outputs.ready != 'true' }}
        run: echo "Stream chaos suite skipped on this branch."

      - name: Upload stream chaos artifact
        if: ${{ always() && steps.stream_chaos_prereqs.outputs.ready == 'true' && (github.event_name != 'pull_request' || needs.select_affected_tests.result != 'success' || needs.select_affected_tests.outputs.full == 'true' || needs.select_affected_tests.outputs.python == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: stream-chaos-${{ matrix.os }}
          path: artifacts/stream_chaos/pytest.xml
          if-no-files-found: error

  python_smoke:
    name: Python smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none

      - uses: ./.github/actions/main-seeded-cache
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ github.job }}-minimal-${{ hashFiles('requirements.txt') }}
          restore-prefix: pip-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal test dependencies
        run: python -m pip install pytest jsonschema requests

      - name: Contract schema smoke
        run: python -m pytest -q tests/test_cli_bridge_contract_exports.py tests/test_import_and_profile_contracts.py tests/test_import_ir_converter.py tests/test_provider_broker.py::test_broker_nine_method_surface_and_plain_data
