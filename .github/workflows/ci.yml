          restore-prefix: pip-${{ runner.os }}-

      - uses: ./.github/actions/main-seeded-cache
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ github.job }}-${{ hashFiles('tui_skeleton/package-lock.json', 'sdk/ts/package-lock.json') }}
          restore-prefix: npm-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install engine dependencies
