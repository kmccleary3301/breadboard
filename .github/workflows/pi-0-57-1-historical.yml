name: Pi 0.57.1 Historical

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  pi-0-57-1-historical:
    name: pi-0-57-1-historical
    runs-on: ubuntu-latest
    env:
      BB_WORKSPACE_ROOT: ${{ github.workspace }}/..
      PI057_CODING_AGENT_NODE_MODULES: ${{ github.workspace }}/tests/fixtures/pi_0_57_1_node/node_modules
      BB_REQUIRE_PINNED_PI057_NODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/fixtures/pi_0_57_1_node/package-lock.json

      - name: Install pinned Pi 0.57.1 dependencies
        working-directory: tests/fixtures/pi_0_57_1_node
        run: npm ci --ignore-scripts

      - name: Verify pinned Pi package and registry integrity
        working-directory: tests/fixtures/pi_0_57_1_node
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const expectedIntegrity = "sha512-u5MQEduj68rwVIsRsqrWkJYiJCyPph/a6bMoJAQKo1sb+Pc17Y/ojwa+wGssnUMjEB38AQKofWTVe8NFEpSWNw==";
          const packageJson = JSON.parse(fs.readFileSync("node_modules/@mariozechner/pi-coding-agent/package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const entry = lock.packages["node_modules/@mariozechner/pi-coding-agent"];
          if (packageJson.version !== "0.57.1") throw new Error(`unexpected Pi version: ${packageJson.version}`);
          if (!entry || entry.integrity !== expectedIntegrity) throw new Error("Pi lock integrity does not match the pinned attachment");
          if (entry.resolved !== "https://registry.npmjs.org/@mariozechner/pi-coding-agent/-/pi-coding-agent-0.57.1.tgz") throw new Error("Pi lock does not resolve the registry tarball");
          NODE

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Bootstrap Python test environment
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run pinned Pi 0.57.1 historical tests
        run: >-
          pytest -q
          tests/rl/harness/test_pi_0_57_1_*.py
          tests/e4_parity/test_pi_0_57_1_*.py
