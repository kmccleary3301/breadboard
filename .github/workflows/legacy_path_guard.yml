name: Legacy Path Guard

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]

jobs:
  legacy-path-guard:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1

      - name: Enforce canonical QueryLake naming
        run: bash scripts/ci_guard_legacy_querylakebackend_refs.sh

