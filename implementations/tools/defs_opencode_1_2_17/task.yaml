execution:
  blocking: false
description: "Launch a new agent to handle complex, multistep tasks autonomously.\n\nAvailable agent types and the\
  \ tools they have access to:\n- general: General-purpose agent for researching complex questions and executing\
  \ multi-step tasks. Use this agent to execute multiple units of work in parallel.\n- explore: Fast agent specialized\
  \ for exploring codebases. Use this when you need to quickly find files by patterns (eg. \"src/components/**/*.tsx\"\
  ), search code for keywords (eg. \"API endpoints\"), or answer questions about the codebase (eg. \"how do API\
  \ endpoints work?\"). When calling this agent, specify the desired thoroughness level: \"quick\" for basic searches,\
  \ \"medium\" for moderate exploration, or \"very thorough\" for comprehensive analysis across multiple locations\
  \ and naming conventions.\n\nWhen using the Task tool, you must specify a subagent_type parameter to select which\
  \ agent type to use.\n\nWhen to use the Task tool:\n- When you are instructed to execute custom slash commands.\
  \ Use the Task tool with the slash command invocation as the entire prompt. The slash command can take arguments.\
  \ For example: Task(description=\"Check the file\", prompt=\"/check-file path/to/file.py\")\n\nWhen NOT to use\
  \ the Task tool:\n- If you want to read a specific file path, use the Read or Glob tool instead of the Task tool,\
  \ to find the match more quickly\n- If you are searching for a specific class definition like \"class Foo\", use\
  \ the Glob tool instead, to find the match more quickly\n- If you are searching for code within a specific file\
  \ or set of 2-3 files, use the Read tool instead of the Task tool, to find the match more quickly\n- Other tasks\
  \ that are not related to the agent descriptions above\n\n\nUsage notes:\n1. Launch multiple agents concurrently\
  \ whenever possible, to maximize performance; to do that, use a single message with multiple tool uses\n2. When\
  \ the agent is done, it will return a single message back to you. The result returned by the agent is not visible\
  \ to the user. To show the user the result, you should send a text message back to the user with a concise summary\
  \ of the result. The output includes a task_id you can reuse later to continue the same subagent session.\n3.\
  \ Each agent invocation starts with a fresh context unless you provide task_id to resume the same subagent session\
  \ (which continues with its previous messages and tool outputs). When starting fresh, your prompt should contain\
  \ a highly detailed task description for the agent to perform autonomously and you should specify exactly what\
  \ information the agent should return back to you in its final and only message to you.\n4. The agent's outputs\
  \ should generally be trusted\n5. Clearly tell the agent whether you expect it to write code or just to do research\
  \ (search, file reads, web fetches, etc.), since it is not aware of the user's intent. Tell it how to verify its\
  \ work if possible (e.g., relevant test commands).\n6. If the agent description mentions that it should be used\
  \ proactively, then you should try your best to use it without the user having to ask for it first. Use your judgement.\n\
  \nExample usage (NOTE: The agents below are fictional examples for illustration only - use the actual agents listed\
  \ above):\n\n<example_agent_descriptions>\n\"code-reviewer\": use this agent after you are done writing a significant\
  \ piece of code\n\"greeting-responder\": use this agent when to respond to user greetings with a friendly joke\n\
  </example_agent_description>\n\n<example>\nuser: \"Please write a function that checks if a number is prime\"\n\
  assistant: Sure let me write a function that checks if a number is prime\nassistant: First let me use the Write\
  \ tool to write a function that checks if a number is prime\nassistant: I'm going to use the Write tool to write\
  \ the following code:\n<code>\nfunction isPrime(n) {\n  if (n <= 1) return false\n  for (let i = 2; i * i <= n;\
  \ i++) {\n    if (n % i === 0) return false\n  }\n  return true\n}\n</code>\n<commentary>\nSince a significant\
  \ piece of code was written and the task was completed, now use the code-reviewer agent to review the code\n</commentary>\n\
  assistant: Now let me use the code-reviewer agent to review the code\nassistant: Uses the Task tool to launch\
  \ the code-reviewer agent\n</example>\n\n<example>\nuser: \"Hello\"\n<commentary>\nSince the user is greeting,\
  \ use the greeting-responder agent to respond with a friendly joke\n</commentary>\nassistant: \"I'm going to use\
  \ the Task tool to launch the with the greeting-responder agent\"\n</example>\n"
parameters:
- name: description
  required: true
  schema: &id001
    description: A short (3-5 words) description of the task
    type: string
  type: string
  description: A short (3-5 words) description of the task
- name: prompt
  required: true
  schema: &id002
    description: The task for the agent to perform
    type: string
  type: string
  description: The task for the agent to perform
- name: subagent_type
  required: true
  schema: &id003
    description: The type of specialized agent to use for this task
    type: string
  type: string
  description: The type of specialized agent to use for this task
- name: task_id
  required: false
  schema: &id004
    description: This should only be set if you mean to resume a previous task (you can pass a prior task_id and
      the task will continue the same subagent session as before instead of creating a fresh one)
    type: string
  type: string
  description: This should only be set if you mean to resume a previous task (you can pass a prior task_id and the
    task will continue the same subagent session as before instead of creating a fresh one)
- name: command
  required: false
  schema: &id005
    description: The command that triggered this task
    type: string
  type: string
  description: The command that triggered this task
