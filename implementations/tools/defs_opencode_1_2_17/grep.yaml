        - Returns file paths and line numbers with at least one match sorted by modification time

        - Use this tool when you need to find files containing specific patterns

        - If you need to identify/count the number of matches within files, use the Bash tool with `rg` (ripgrep)
        directly. Do NOT use `grep`.

        - When you are doing an open-ended search that may require multiple rounds of globbing and grepping, use
        the Task tool instead

        '
      parameters:
        $schema: https://json-schema.org/draft/2020-12/schema
        type: object
        properties:
          pattern: *id001
          path: *id002
          include: *id003
        required:
        - pattern
        additionalProperties: false
      strict: false
