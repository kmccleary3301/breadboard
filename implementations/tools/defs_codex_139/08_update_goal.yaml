id: update_goal
name: update_goal
description: 'Update the existing goal.

  Use this tool only to mark the goal achieved or genuinely blocked.

  Set status to `complete` only when the objective has actually been achieved and no required work remains.

  Set status to `blocked` only when the same blocking condition has repeated for at least three consecutive goal
  turns, counting the original/user-triggered turn and any automatic continuations, and the agent cannot make meaningful
  progress without user input or an external-state change.

  If the user resumes a goal that was previously marked `blocked`, treat the resumed run as a fresh blocked audit.
  If the same blocking condition then repeats for at least three consecutive resumed goal turns, set status to `blocked`
  again.

  Once the blocked threshold is satisfied, do not keep reporting that you are still blocked while leaving the goal
  active; set status to `blocked`.

  Do not use `blocked` merely because the work is hard, slow, uncertain, incomplete, or would benefit from clarification.

  Do not mark a goal complete merely because its budget is nearly exhausted or because you are stopping work.

  You cannot use this tool to pause, resume, budget-limit, or usage-limit a goal; those status changes are controlled
  by the user or system.

  When marking a budgeted goal achieved with status `complete`, report the final token usage from the tool result
  to the user.'
type_id: python
syntax_formats_supported:
- native_function_calling
preferred_formats:
- native_function_calling
parameters:
- name: status
  type: string
  required: true
  schema: &id001
    type: string
    description: Required. Set to `complete` only when the objective is achieved and no required work remains. Set
      to `blocked` only after the same blocking condition has recurred for at least three consecutive goal turns
      and the agent is at an impasse. After a previously blocked goal is resumed, the resumed run starts a fresh
      blocked audit.
    enum:
    - complete
    - blocked
execution:
  blocking: true
