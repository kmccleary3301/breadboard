execution:
  blocking: false
description: "Executes a given bash command in a persistent shell session with optional timeout, ensuring proper\
  \ handling and security measures.\n\nAll commands run in ${directory} by default. Use the `workdir` parameter\
  \ if you need to run a command in a different directory. AVOID using `cd <directory> && <command>` patterns -\
  \ use `workdir` instead.\n\nIMPORTANT: This tool is for terminal operations like git, npm, docker, etc. DO NOT\
  \ use it for file operations (reading, writing, editing, searching, finding files) - use the specialized tools\
  \ for this instead.\n\nBefore executing the command, please follow these steps:\n\n1. Directory Verification:\n\
  \   - If the command will create new directories or files, first use `ls` to verify the parent directory exists\
  \ and is the correct location\n   - For example, before running \"mkdir foo/bar\", first use `ls foo` to check\
  \ that \"foo\" exists and is the intended parent directory\n\n2. Command Execution:\n   - Always quote file paths\
  \ that contain spaces with double quotes (e.g., rm \"path with spaces/file.txt\")\n   - Examples of proper quoting:\n\
  \     - mkdir \"/Users/name/My Documents\" (correct)\n     - mkdir /Users/name/My Documents (incorrect - will\
  \ fail)\n     - python \"/path/with spaces/script.py\" (correct)\n     - python /path/with spaces/script.py (incorrect\
  \ - will fail)\n   - After ensuring proper quoting, execute the command.\n   - Capture the output of the command.\n\
  \nUsage notes:\n  - The command argument is required.\n  - You can specify an optional timeout in milliseconds.\
  \ If not specified, commands will time out after 120000ms (2 minutes).\n  - It is very helpful if you write a\
  \ clear, concise description of what this command does in 5-10 words.\n  - If the output exceeds 2000 lines or\
  \ 51200 bytes, it will be truncated and the full output will be written to a file. You can use Read with offset/limit\
  \ to read specific sections or Grep to search the full content. Do NOT use `head`, `tail`, or other truncation\
  \ commands to limit output; the full output will already be captured to a file for more precise searching.\n\n\
  \  - Avoid using Bash with the `find`, `grep`, `cat`, `head`, `tail`, `sed`, `awk`, or `echo` commands, unless\
  \ explicitly instructed or when these commands are truly necessary for the task. Instead, always prefer using\
  \ the dedicated tools for these commands:\n    - File search: Use Glob (NOT find or ls)\n    - Content search:\
  \ Use Grep (NOT grep or rg)\n    - Read files: Use Read (NOT cat/head/tail)\n    - Edit files: Use Edit (NOT sed/awk)\n\
  \    - Write files: Use Write (NOT echo >/cat <<EOF)\n    - Communication: Output text directly (NOT echo/printf)\n\
  \  - When issuing multiple commands:\n    - If the commands are independent and can run in parallel, make multiple\
  \ Bash tool calls in a single message. For example, if you need to run \"git status\" and \"git diff\", send a\
  \ single message with two Bash tool calls in parallel.\n    - If the commands depend on each other and must run\
  \ sequentially, use a single Bash call with '&&' to chain them together (e.g., `git add . && git commit -m \"\
  message\" && git push`). For instance, if one operation must complete before another starts (like mkdir before\
  \ cp, Write before Bash for git operations, or git add before git commit), run these operations sequentially instead.\n\
  \    - Use ';' only when you need to run commands sequentially but don't care if earlier commands fail\n    -\
  \ DO NOT use newlines to separate commands (newlines are ok in quoted strings)\n  - AVOID using `cd <directory>\
  \ && <command>`. Use the `workdir` parameter to change directories instead.\n    <good-example>\n    Use workdir=\"\
  /foo/bar\" with command: pytest tests\n    </good-example>\n    <bad-example>\n    cd /foo/bar && pytest tests\n\
  \    </bad-example>\n\n# Committing changes with git\n\nOnly create commits when requested by the user. If unclear,\
  \ ask first. When the user asks you to create a new git commit, follow these steps carefully:\n\nGit Safety Protocol:\n\
  - NEVER update the git config\n- NEVER run destructive/irreversible git commands (like push --force, hard reset,\
  \ etc) unless the user explicitly requests them\n- NEVER skip hooks (--no-verify, --no-gpg-sign, etc) unless the\
  \ user explicitly requests it\n- NEVER run force push to main/master, warn the user if they request it\n- Avoid\
  \ git commit --amend. ONLY use --amend when ALL conditions are met:\n  (1) User explicitly requested amend, OR\
  \ commit SUCCEEDED but pre-commit hook auto-modified files that need including\n  (2) HEAD commit was created\
  \ by you in this conversation (verify: git log -1 --format='%an %ae')\n  (3) Commit has NOT been pushed to remote\
  \ (verify: git status shows \"Your branch is ahead\")\n- CRITICAL: If commit FAILED or was REJECTED by hook, NEVER\
  \ amend - fix the issue and create a NEW commit\n- CRITICAL: If you already pushed to remote, NEVER amend unless\
  \ user explicitly requests it (requires force push)\n- NEVER commit changes unless the user explicitly asks you\
  \ to. It is VERY IMPORTANT to only commit when explicitly asked, otherwise the user will feel that you are being\
  \ too proactive.\n\n1. You can call multiple tools in a single response. When multiple independent pieces of information\
  \ are requested and all commands are likely to succeed, run multiple tool calls in parallel for optimal performance.\
  \ run the following bash commands in parallel, each using the Bash tool:\n  - Run a git status command to see\
  \ all untracked files.\n  - Run a git diff command to see both staged and unstaged changes that will be committed.\n\
  \  - Run a git log command to see recent commit messages, so that you can follow this repository's commit message\
  \ style.\n2. Analyze all staged changes (both previously staged and newly added) and draft a commit message:\n\
  \  - Summarize the nature of the changes (eg. new feature, enhancement to an existing feature, bug fix, refactoring,\
  \ test, docs, etc.). Ensure the message accurately reflects the changes and their purpose (i.e. \"add\" means\
  \ a wholly new feature, \"update\" means an enhancement to an existing feature, \"fix\" means a bug fix, etc.).\n\
  \  - Do not commit files that likely contain secrets (.env, credentials.json, etc.). Warn the user if they specifically\
  \ request to commit those files\n  - Draft a concise (1-2 sentences) commit message that focuses on the \"why\"\
  \ rather than the \"what\"\n  - Ensure it accurately reflects the changes and their purpose\n3. You can call multiple\
  \ tools in a single response. When multiple independent pieces of information are requested and all commands are\
  \ likely to succeed, run multiple tool calls in parallel for optimal performance. run the following commands:\n\
  \   - Add relevant untracked files to the staging area.\n   - Create the commit with a message\n   - Run git status\
  \ after the commit completes to verify success.\n   Note: git status depends on the commit completing, so run\
  \ it sequentially after the commit.\n4. If the commit fails due to pre-commit hook, fix the issue and create a\
  \ NEW commit (see amend rules above)\n\nImportant notes:\n- NEVER run additional commands to read or explore code,\
  \ besides git bash commands\n- NEVER use the TodoWrite or Task tools\n- DO NOT push to the remote repository unless\
  \ the user explicitly asks you to do so\n- IMPORTANT: Never use git commands with the -i flag (like git rebase\
  \ -i or git add -i) since they require interactive input which is not supported.\n- If there are no changes to\
  \ commit (i.e., no untracked files and no modifications), do not create an empty commit\n\n# Creating pull requests\n\
  Use the gh command via the Bash tool for ALL GitHub-related tasks including working with issues, pull requests,\
  \ checks, and releases. If given a GitHub URL use the gh command to get the information needed.\n\nIMPORTANT:\
  \ When the user asks you to create a pull request, follow these steps carefully:\n\n1. You can call multiple tools\
  \ in a single response. When multiple independent pieces of information are requested and all commands are likely\
  \ to succeed, run multiple tool calls in parallel for optimal performance. run the following bash commands in\
  \ parallel using the Bash tool, in order to understand the current state of the branch since it diverged from\
  \ the main branch:\n   - Run a git status command to see all untracked files\n   - Run a git diff command to see\
  \ both staged and unstaged changes that will be committed\n   - Check if the current branch tracks a remote branch\
  \ and is up to date with the remote, so you know if you need to push to the remote\n   - Run a git log command\
  \ and `git diff [base-branch]...HEAD` to understand the full commit history for the current branch (from the time\
  \ it diverged from the base branch)\n2. Analyze all changes that will be included in the pull request, making\
  \ sure to look at all relevant commits (NOT just the latest commit, but ALL commits that will be included in the\
  \ pull request!!!), and draft a pull request summary\n3. You can call multiple tools in a single response. When\
  \ multiple independent pieces of information are requested and all commands are likely to succeed, run multiple\
  \ tool calls in parallel for optimal performance. run the following commands in parallel:\n   - Create new branch\
  \ if needed\n   - Push to remote with -u flag if needed\n   - Create PR using gh pr create with the format below.\
  \ Use a HEREDOC to pass the body to ensure correct formatting.\n<example>\ngh pr create --title \"the pr title\"\
  \ --body \"$(cat <<'EOF'\n## Summary\n<1-3 bullet points>\n</example>\n\nImportant:\n- DO NOT use the TodoWrite\
  \ or Task tools\n- Return the PR URL when you're done, so the user can see it\n\n# Other common operations\n-\
  \ View comments on a GitHub PR: gh api repos/foo/bar/pulls/123/comments\n"
