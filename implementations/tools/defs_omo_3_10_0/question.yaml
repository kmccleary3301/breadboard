# Pinned stock OpenCode 1.2.17 registry; plugin 5137df72.
# Captured stock schema. Runtime stock catalog supplies workspace/skill-dependent text.
id: question
name: question
type_id: python
manipulations: []
syntax_formats_supported:
- native_function_calling
preferred_formats:
- native_function_calling
execution:
  blocking: false
description: 'Use this tool when you need to ask the user questions during execution. This allows you to:

  1. Gather user preferences or requirements

  2. Clarify ambiguous instructions

  3. Get decisions on implementation choices as you work

  4. Offer choices to the user about what direction to take.


  Usage notes:

  - When `custom` is enabled (default), a "Type your own answer" option is added automatically; don''t include "Other"
  or catch-all options

  - Answers are returned as arrays of labels; set `multiple: true` to allow selecting more than one

  - If you recommend a specific option, make that the first option in the list and add "(Recommended)" at the end
  of the label

  '
parameters:
- name: questions
  required: true
  schema: &id001
    description: Questions to ask
    type: array
    items:
      type: object
      properties:
        question:
          description: Complete question
          type: string
        header:
          description: Very short label (max 30 chars)
          type: string
        options:
          description: Available choices
          type: array
          items:
            ref: QuestionOption
            type: object
            properties:
              label:
                description: Display text (1-5 words, concise)
                type: string
              description:
                description: Explanation of choice
                type: string
            required:
            - label
            - description
            additionalProperties: false
        multiple:
          description: Allow selecting multiple choices
          type: boolean
      required:
      - question
      - header
      - options
      additionalProperties: false
  type: array
  description: Questions to ask
provider_routing:
  openai:
    native_primary: true
    strict: false
    responses_tool_schema:
      type: function
      name: question
      description: 'Use this tool when you need to ask the user questions during execution. This allows you to:

        1. Gather user preferences or requirements

        2. Clarify ambiguous instructions

        3. Get decisions on implementation choices as you work

        4. Offer choices to the user about what direction to take.


        Usage notes:

        - When `custom` is enabled (default), a "Type your own answer" option is added automatically; don''t include
        "Other" or catch-all options

        - Answers are returned as arrays of labels; set `multiple: true` to allow selecting more than one

        - If you recommend a specific option, make that the first option in the list and add "(Recommended)" at
        the end of the label

        '
      parameters:
        $schema: https://json-schema.org/draft/2020-12/schema
        type: object
        properties:
          questions: *id001
        required:
        - questions
        additionalProperties: false
      strict: false
