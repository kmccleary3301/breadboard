- native_function_calling
execution:
  blocking: false
description: 'Fast content search tool with safety limits (60s timeout, 256KB output). Searches file contents using
  regular expressions. Supports full regex syntax (eg. "log.*Error", "function\s+\w+", etc.). Filter files by pattern
  with the include parameter (eg. "*.js", "*.{ts,tsx}"). Output modes: "content" shows matching lines, "files_with_matches"
  shows only file paths (default), "count" shows match counts per file.'
parameters:
- name: pattern
  required: true
  schema: &id001
    type: string
  type: string
- name: include
  required: false
  schema: &id002
    type: string
  type: string
- name: path
  required: false
  schema: &id003
    type: string
  type: string
- name: output_mode
  required: false
  schema: &id004
    type: string
    enum:
    - content
    - files_with_matches
    - count
  type: string
- name: head_limit
  required: false
  schema: &id005
    type: number
  type: number
