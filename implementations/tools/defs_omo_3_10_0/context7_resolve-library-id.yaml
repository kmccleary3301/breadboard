id: context7_resolve-library-id
name: context7_resolve-library-id
type_id: python
manipulations: []
syntax_formats_supported:
- native_function_calling
preferred_formats:
- native_function_calling
execution:
  blocking: false
description: 'Resolves a package/product name to a Context7-compatible library ID and returns matching libraries.


  You MUST call this function before ''Query Documentation'' tool to obtain a valid Context7-compatible library
  ID UNLESS the user explicitly provides a library ID in the format ''/org/project'' or ''/org/project/version''
  in their query.


  Each result includes:

  - Library ID: Context7-compatible identifier (format: /org/project)

  - Name: Library or package name

  - Description: Short summary

  - Code Snippets: Number of available code examples

  - Source Reputation: Authority indicator (High, Medium, Low, or Unknown)

  - Benchmark Score: Quality indicator (100 is the highest score)

  - Versions: List of versions if available. Use one of those versions if the user provides a version in their query.
  The format of the version is /org/project/version.


  For best results, select libraries based on name match, source reputation, snippet coverage, benchmark score,
  and relevance to your use case.


  Selection Process:

  1. Analyze the query to understand what library/package the user is looking for

  2. Return the most relevant match based on:

  - Name similarity to the query (exact matches prioritized)

  - Description relevance to the query''s intent

  - Documentation coverage (prioritize libraries with higher Code Snippet counts)

  - Source reputation (consider libraries with High or Medium reputation more authoritative)

  - Benchmark Score: Quality indicator (100 is the highest score)


  Response Format:

  - Return the selected library ID in a clearly marked section

  - Provide a brief explanation for why this library was chosen

  - If multiple good matches exist, acknowledge this but proceed with the most relevant one

  - If no good matches exist, clearly state this and suggest query refinements


  For ambiguous queries, request clarification before proceeding with a best-guess match.


  IMPORTANT: Do not call this tool more than 3 times per question. If you cannot find what you need after 3 calls,
  use the best result you have.'
parameters:
- name: query
  required: true
  schema: &id001
    type: string
    description: What to look up in the library's documentation. This is used to rank library results by relevance
      to what the user is trying to accomplish. The query is sent to the Context7 API for processing. Do not include
      any sensitive or confidential information such as API keys, passwords, credentials, personal data, or proprietary
      code in your query.
  type: string
  description: What to look up in the library's documentation. This is used to rank library results by relevance
    to what the user is trying to accomplish. The query is sent to the Context7 API for processing. Do not include
    any sensitive or confidential information such as API keys, passwords, credentials, personal data, or proprietary
    code in your query.
- name: libraryName
  required: true
  schema: &id002
    type: string
    description: Library name to search for and retrieve a Context7-compatible library ID. Use the official library
      name with proper punctuation — e.g., 'Next.js' instead of 'nextjs', 'Customer.io' instead of 'customerio',
      'Three.js' instead of 'threejs'.
  type: string
  description: Library name to search for and retrieve a Context7-compatible library ID. Use the official library
    name with proper punctuation — e.g., 'Next.js' instead of 'nextjs', 'Customer.io' instead of 'customerio', 'Three.js'
    instead of 'threejs'.
