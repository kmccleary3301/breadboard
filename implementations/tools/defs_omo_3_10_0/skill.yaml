description: "Load a skill or execute a slash command to get detailed instructions for a specific task.\n\nSkills\
  \ and commands provide specialized knowledge and step-by-step guidance.\nUse this when a task matches an available\
  \ skill's or command's description.\n\n**How to use:**\n- Call with a skill name: name='code-review'\n- Call with\
  \ a command name (without leading slash): name='publish'\n- The tool will return detailed instructions with your\
  \ context applied.\n\n<available_items>\nPriority: project > user > opencode > builtin/plugin | Skills listed\
  \ before commands\nInvoke via: skill(name=\"item-name\") — omit leading slash for commands.\n  <skill>\n    <name>playwright</name>\n\
  \    <description>(opencode - Skill) MUST USE for any browser-related tasks. Browser automation via Playwright\
  \ MCP - verification, browsing, information gathering, web scraping, testing, screenshots, and all browser interactions.</description>\n\
  \  </skill>\n  <skill>\n    <name>frontend-ui-ux</name>\n    <description>(opencode - Skill) Designer-turned-developer\
  \ who crafts stunning UI/UX even without design mockups</description>\n  </skill>\n  <skill>\n    <name>git-master</name>\n\
  \    <description>(opencode - Skill) MUST USE for ANY git operations. Atomic commits, rebase/squash, history search\
  \ (blame, bisect, log -S). STRONGLY RECOMMENDED: Use with task(category='quick', load_skills=['git-master'], ...)\
  \ to save context. Triggers: 'commit', 'rebase', 'squash', 'who wrote', 'when was X added', 'find the commit that'.</description>\n\
  \  </skill>\n  <skill>\n    <name>dev-browser</name>\n    <description>(opencode - Skill) Browser automation with\
  \ persistent page state. Use when users ask to navigate websites, fill forms, take screenshots, extract web data,\
  \ test web apps, or automate browser workflows. Trigger phrases include 'go to [url]', 'click on', 'fill out the\
  \ form', 'take a screenshot', 'scrape', 'automate', 'test the website', 'log into', or any browser interaction\
  \ request.</description>\n  </skill>\n  <command>\n    <name>/init-deep</name>\n    <description>(builtin) Initialize\
  \ hierarchical AGENTS.md knowledge base</description>\n    <scope>builtin</scope>\n  </command>\n  <command>\n\
  \    <name>/ralph-loop</name>\n    <description>(builtin) Start self-referential development loop until completion</description>\n\
  \    <scope>builtin</scope>\n  </command>\n  <command>\n    <name>/ulw-loop</name>\n    <description>(builtin)\
  \ Start ultrawork loop - continues until completion with ultrawork mode</description>\n    <scope>builtin</scope>\n\
  \  </command>\n  <command>\n    <name>/cancel-ralph</name>\n    <description>(builtin) Cancel active Ralph Loop</description>\n\
  \    <scope>builtin</scope>\n  </command>\n  <command>\n    <name>/refactor</name>\n    <description>(builtin)\
  \ Intelligent refactoring command with LSP, AST-grep, architecture analysis, codemap, and TDD verification.</description>\n\
  \    <scope>builtin</scope>\n  </command>\n  <command>\n    <name>/start-work</name>\n    <description>(builtin)\
  \ Start Sisyphus work session from Prometheus plan</description>\n    <scope>builtin</scope>\n  </command>\n \
  \ <command>\n    <name>/stop-continuation</name>\n    <description>(builtin) Stop all continuation mechanisms\
  \ (ralph loop, todo continuation, boulder) for this session</description>\n    <scope>builtin</scope>\n  </command>\n\
  \  <command>\n    <name>/handoff</name>\n    <description>(builtin) Create a detailed context summary for continuing\
  \ work in a new session</description>\n    <scope>builtin</scope>\n  </command>\n</available_items>"
