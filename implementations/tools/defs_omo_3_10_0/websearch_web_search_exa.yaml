id: websearch_web_search_exa
name: websearch_web_search_exa
type_id: python
manipulations: []
syntax_formats_supported:
- native_function_calling
preferred_formats:
- native_function_calling
execution:
  blocking: false
description: "Search the web for any topic and get clean, ready-to-use content.\n\n      Best for: Finding current\
  \ information, news, facts, people, companies, or answering questions about any topic.\n      Returns: Clean text\
  \ content from top search results.\n\n      Query tips:\n      describe the ideal page, not keywords. \"blog post\
  \ comparing React and Vue performance\" not \"React vs Vue\".\n      Use category:people / category:company to\
  \ search through Linkedin profiles / companies respectively.\n      If highlights are insufficient, follow up\
  \ with web_fetch_exa on the best URLs."
parameters:
- name: query
  required: true
  schema: &id001
    type: string
    minLength: 1
    description: Natural language search query. Should be a semantically rich description of the ideal page, not
      just keywords. Optionally include category:<type> (company, people) to focus results — e.g. 'category:people
      John Doe software engineer'.
  type: string
  description: Natural language search query. Should be a semantically rich description of the ideal page, not just
    keywords. Optionally include category:<type> (company, people) to focus results — e.g. 'category:people John
    Doe software engineer'.
- name: numResults
  required: false
  schema: &id002
    type: number
    description: 'Number of search results to return (default: 10).'
  type: number
  description: 'Number of search results to return (default: 10).'
- name: objective
  required: true
  schema: &id003
    type: string
    minLength: 1
    maxLength: 4096
    description: Goal for this search turn; say which documents should rank first, which should be excluded, and
      what specific facts or figures to pull from them.
  type: string
  description: Goal for this search turn; say which documents should rank first, which should be excluded, and what
    specific facts or figures to pull from them.
