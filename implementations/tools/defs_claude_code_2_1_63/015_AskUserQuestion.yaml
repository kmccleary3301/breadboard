{
  "id": "claude_code_2_1_63.AskUserQuestion",
  "name": "AskUserQuestion",
  "description": "Use this tool when you need to ask the user questions during execution. This allows you to:\n1. Gather user preferences or requirements\n2. Clarify ambiguous instructions\n3. Get decisions on implementation choices as you work\n4. Offer choices to the user about what direction to take.\n\nUsage notes:\n- Users will always be able to select \"Other\" to provide custom text input\n- Use multiSelect: true to allow multiple answers to be selected for a question\n- If you recommend a specific option, make that the first option in the list and add \"(Recommended)\" at the end of the label\n\nPlan mode note: In plan mode, use this tool to clarify requirements or choose between approaches BEFORE finalizing your plan. Do NOT use this tool to ask \"Is my plan ready?\" or \"Should I proceed?\" - use ExitPlanMode for plan approval. IMPORTANT: Do not reference \"the plan\" in your questions (e.g., \"Do you have feedback about the plan?\", \"Does the plan look good?\") because the user cannot see the plan in the UI until you call ExitPlanMode. If you need plan approval, use ExitPlanMode instead.\n",
  "type_id": "python",
  "syntax_formats_supported": [
    "native_function_calling"
  ],
  "preferred_formats": [
    "native_function_calling"
  ],
  "parameters": [
    {
      "name": "questions",
      "required": true,
      "type": "array",
      "description": "Questions to ask the user (1-4 questions)",
      "schema": {
        "description": "Questions to ask the user (1-4 questions)",
        "minItems": 1,
        "maxItems": 4,
        "type": "array",
        "items": {
          "type": "object",
          "properties": {
            "question": {
              "description": "The complete question to ask the user. Should be clear, specific, and end with a question mark. Example: \"Which library should we use for date formatting?\" If multiSelect is true, phrase it accordingly, e.g. \"Which features do you want to enable?\"",
              "type": "string"
            },
            "header": {
              "description": "Very short label displayed as a chip/tag (max 12 chars). Examples: \"Auth method\", \"Library\", \"Approach\".",
              "type": "string"
            },
            "options": {
              "description": "The available choices for this question. Must have 2-4 options. Each option should be a distinct, mutually exclusive choice (unless multiSelect is enabled). There should be no 'Other' option, that will be provided automatically.",
              "minItems": 2,
              "maxItems": 4,
              "type": "array",
              "items": {
                "type": "object",
                "properties": {
                  "label": {
                    "description": "The display text for this option that the user will see and select. Should be concise (1-5 words) and clearly describe the choice.",
                    "type": "string"
                  },
                  "description": {
                    "description": "Explanation of what this option means or what will happen if chosen. Useful for providing context about trade-offs or implications.",
                    "type": "string"
                  },
                  "markdown": {
                    "description": "Optional preview content shown in a monospace box when this option is focused. Use for ASCII mockups, code snippets, or diagrams that help users visually compare options. Supports multi-line text with newlines.",
                    "type": "string"
                  }
                },
                "required": [
                  "label",
                  "description"
                ],
                "additionalProperties": false
              }
            },
            "multiSelect": {
              "description": "Set to true to allow the user to select multiple options instead of just one. Use when choices are not mutually exclusive.",
              "default": false,
              "type": "boolean"
            }
          },
          "required": [
            "question",
            "header",
            "options",
            "multiSelect"
          ],
          "additionalProperties": false
        }
      }
    },
    {
      "name": "answers",
      "required": false,
      "type": "object",
      "description": "User answers collected by the permission component",
      "schema": {
        "description": "User answers collected by the permission component",
        "type": "object",
        "propertyNames": {
          "type": "string"
        },
        "additionalProperties": {
          "type": "string"
        }
      }
    },
    {
      "name": "annotations",
      "required": false,
      "type": "object",
      "description": "Optional per-question annotations from the user (e.g., notes on preview selections). Keyed by question text.",
      "schema": {
        "description": "Optional per-question annotations from the user (e.g., notes on preview selections). Keyed by question text.",
        "type": "object",
        "propertyNames": {
          "type": "string"
        },
        "additionalProperties": {
          "type": "object",
          "properties": {
            "markdown": {
              "description": "The markdown preview content of the selected option, if the question used previews.",
              "type": "string"
            },
            "notes": {
              "description": "Free-text notes the user added to their selection.",
              "type": "string"
            }
          },
          "additionalProperties": false
        }
      }
    },
    {
      "name": "metadata",
      "required": false,
      "type": "object",
      "description": "Optional metadata for tracking and analytics purposes. Not displayed to user.",
      "schema": {
        "description": "Optional metadata for tracking and analytics purposes. Not displayed to user.",
        "type": "object",
        "properties": {
          "source": {
            "description": "Optional identifier for the source of this question (e.g., \"remember\" for /remember command). Used for analytics tracking.",
            "type": "string"
          }
        },
        "additionalProperties": false
      }
    }
  ],
  "execution": {
    "blocking": false,
    "native_semantics": "claude_code_2_1_63"
  },
