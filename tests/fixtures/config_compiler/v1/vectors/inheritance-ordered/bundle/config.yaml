version: 2
extends: [base.yaml, later.yaml]
features:
  nested: {child: child}
  empty_target: {}
profile:
  name: generated-unclassified-agent
workspace:
  root: workspace
providers:
  default_model: test-model
  models:
    - id: test-model
      adapter: openai
      params:
        temperature: 0.25
prompts:
  injection:
    system_order: []
    per_turn_order: []
modes:
  - id: build
    prompt: ''
loop:
  sequence: [build]
