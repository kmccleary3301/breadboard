  - id: DSH-PROTOCOL-8_1-001
    family: protocol
    source_section: "8.1"
    ordinal: 1
    kind: protocol
    source_text: "8.1 Scope and binding Who can see this Capability? Which implementation supplies it? At what lifetime? Under which activation generation?"
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:383-390"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-PROTOCOL-8_2-002
    family: protocol
    source_section: "8.2"
    ordinal: 2
    kind: protocol
    source_text: "8.2 Policy and authority Who is allowed to request this Operation? Which constraints are advisory? Which denials are irrevocable? Is approval required? What can the sandbox enforce?"
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:392-400"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-PROTOCOL-8_3-003
    family: protocol
    source_section: "8.3"
    ordinal: 3
    kind: protocol
    source_text: "8.3 Lease and lifecycle Who owns this Entity, Operation, or Resource? When is it published? How is it drained? How is cleanup proven? Can stale owners still commit?"
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:402-410"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-PROTOCOL-8_4-004
    family: protocol
    source_section: "8.4"
    ordinal: 4
    kind: protocol
    source_text: "8.4 Message and delivery What content is delivered? Who produced it? Does it wake the agent? Which turn or step may admit it? How is duplicate delivery prevented?"
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:412-420"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-10-001
    family: law
    source_section: "10"
    ordinal: 1
    kind: law
    source_text: "Model-visible implies durably referenced."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:497-497"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-10-002
    family: law
    source_section: "10"
    ordinal: 2
    kind: law
    source_text: "The Event log leads; caches and projections follow."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:500-500"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-10-003
    family: law
    source_section: "10"
    ordinal: 3
    kind: law
    source_text: "A materialized view may be stale, absent, or rebuilt; it may not contradict its source."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:503-503"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-10-004
    family: law
    source_section: "10"
    ordinal: 4
    kind: law
    source_text: "A full snapshot is preferred over an ingenious delta when it materially simplifies replay."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:506-506"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-10-005
    family: law
    source_section: "10"
    ordinal: 5
    kind: law
    source_text: "Unknown required events fail faithful replay."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:509-509"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-10-006
    family: law
    source_section: "10"
    ordinal: 6
    kind: law
    source_text: "An event may be ignored only when its writer explicitly marks that safe."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:512-512"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-10-007
    family: law
    source_section: "10"
    ordinal: 7
    kind: law
    source_text: "Artifacts carry bytes and evidence; Events carry state transitions. Neither substitutes for the other."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:515-515"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-11-001
    family: law
    source_section: "11"
    ordinal: 1
    kind: law
    source_text: "One ordinary send creates at most one ordinary turn."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:523-523"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-11-002
    family: law
    source_section: "11"
    ordinal: 2
    kind: law
    source_text: "Independent sends are never silently timing-batched."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:526-526"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-11-003
    family: law
    source_section: "11"
    ordinal: 3
    kind: law
    source_text: "Explicit batching must be caller-visible."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:529-529"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-11-004
    family: law
    source_section: "11"
    ordinal: 4
    kind: law
    source_text: "followup, steer, and inject have different timing and wake semantics."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:532-532"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-11-005
    family: law
    source_section: "11"
    ordinal: 5
    kind: law
    source_text: "Injecting context does not create a fake turn."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:535-535"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-11-006
    family: law
    source_section: "11"
    ordinal: 6
    kind: law
    source_text: "Context intended for the request currently being assembled is distinct from context intended for a later request."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:538-538"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-11-007
    family: law
    source_section: "11"
    ordinal: 7
    kind: law
    source_text: "A partial assistant response shown to the user remains part of subsequent model history."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:541-541"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-11-008
    family: law
    source_section: "11"
    ordinal: 8
    kind: law
    source_text: "Input accepted during cancellation convergence must not become stranded."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:544-544"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-12-001
    family: law
    source_section: "12"
    ordinal: 1
    kind: law
    source_text: "Every admitted Operation receives exactly one terminal outcome."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:552-552"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-12-002
    family: law
    source_section: "12"
    ordinal: 2
    kind: law
    source_text: "Cancellation requested is not the same as cancellation completed."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:555-555"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-12-003
    family: law
    source_section: "12"
    ordinal: 3
    kind: law
    source_text: "Timeout notifies; the capability owner must actually terminate and join the work."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:558-558"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-12-004
    family: law
    source_section: "12"
    ordinal: 4
    kind: law
    source_text: "Canonical programmatic value, model-facing rendering, and UI presentation are distinct."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:561-561"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-12-005
    family: law
    source_section: "12"
    ordinal: 5
    kind: law
    source_text: "A model-text redaction is not a confidentiality boundary if the canonical value still leaks."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:564-564"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-12-006
    family: law
    source_section: "12"
    ordinal: 6
    kind: law
    source_text: "Safety-owner denials are monotonic."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:567-567"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-12-007
    family: law
    source_section: "12"
    ordinal: 7
    kind: law
    source_text: "Unknown concurrency safety means exclusive."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:570-570"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-12-008
    family: law
    source_section: "12"
    ordinal: 8
    kind: law
    source_text: "Parallel dispatch may complete out of order; durable/model-visible results remain deterministic."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:573-573"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-12-009
    family: law
    source_section: "12"
    ordinal: 9
    kind: law
    source_text: "Nested work cites opaque execution identity rather than receiving mutable parent internals."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:576-576"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-12-010
    family: law
    source_section: "12"
    ordinal: 10
    kind: law
    source_text: "Context produced by an Operation becomes visible only after its result reaches a settled boundary."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:579-579"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-13-001
    family: law
    source_section: "13"
    ordinal: 1
    kind: law
    source_text: "Candidate implementations are prepared before publication."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:587-587"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-13-002
    family: law
    source_section: "13"
    ordinal: 2
    kind: law
    source_text: "Candidate failure leaves the last-good generation authoritative."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:590-590"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-13-003
    family: law
    source_section: "13"
    ordinal: 3
    kind: law
    source_text: "Every registration or resource has an owner and disposer."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:593-593"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-13-004
    family: law
    source_section: "13"
    ordinal: 4
    kind: law
    source_text: "Disposal reaches quiescence rather than merely requesting cancellation."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:596-596"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-13-005
    family: law
    source_section: "13"
    ordinal: 5
    kind: law
    source_text: "Existing Sessions remain pinned unless migration is explicit."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:599-599"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-13-006
    family: law
    source_section: "13"
    ordinal: 6
    kind: law
    source_text: "One request pins one exact implementation generation through resolution and dispatch."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:602-602"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-13-007
    family: law
    source_section: "13"
    ordinal: 7
    kind: law
    source_text: "Scope controls visibility, not permission."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:605-605"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-13-008
    family: law
    source_section: "13"
    ordinal: 8
    kind: law
    source_text: "Configuration changes are explicit mutations with provenance and revision."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:608-608"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-13-009
    family: law
    source_section: "13"
    ordinal: 9
    kind: law
    source_text: "Runtime fallback occurs only when represented in compiled policy."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:611-611"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-13-010
    family: law
    source_section: "13"
    ordinal: 10
    kind: law
    source_text: "Reload failure is reported honestly; compensation is not called perfect atomicity when effects were briefly visible."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:614-614"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-14-001
    family: law
    source_section: "14"
    ordinal: 1
    kind: law
    source_text: "A process can time out and exit successfully; report both facts."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:620-620"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-14-002
    family: law
    source_section: "14"
    ordinal: 2
    kind: law
    source_text: "A reminder being queued does not prove the model answered."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:623-623"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-14-003
    family: law
    source_section: "14"
    ordinal: 3
    kind: law
    source_text: "A message marked delivered does not prove the user read it."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:626-626"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-14-004
    family: law
    source_section: "14"
    ordinal: 4
    kind: law
    source_text: "A worker saying “done” does not certify its work."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:629-629"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-14-005
    family: law
    source_section: "14"
    ordinal: 5
    kind: law
    source_text: "A snapshot update proves deterministic output, not semantic correctness."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:632-632"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-14-006
    family: law
    source_section: "14"
    ordinal: 6
    kind: law
    source_text: "A cache hit proves identity criteria matched, not that inputs remain behaviorally relevant."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:635-635"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-14-007
    family: law
    source_section: "14"
    ordinal: 7
    kind: law
    source_text: "A test must observe the actual world, not the agent’s report."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:638-638"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-LAW-14-008
    family: law
    source_section: "14"
    ordinal: 8
    kind: law
    source_text: "A provider being present in source does not prove it is available, authenticated, or enabled."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:641-641"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-DONOR-15-001
    family: donor
    source_section: "15"
    ordinal: 1
    kind: adopt
