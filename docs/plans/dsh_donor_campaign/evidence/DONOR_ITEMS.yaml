  - id: DSH-DONOR-15-008
    family: donor
    source_section: "15"
    ordinal: 8
    kind: adopt
    source_text: "Pending messages addressable by ID before claim."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:675-675"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-DONOR-15-009
    family: donor
    source_section: "15"
    ordinal: 9
    kind: adopt
    source_text: "Normalized inbox insertion/replacement/removal/claim/discard records."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:677-677"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-DONOR-15-010
    family: donor
    source_section: "15"
    ordinal: 10
    kind: process
    source_text: "Atomic claim before pre-step processing."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:679-679"
    primary_anchor: NO_PRIMARY_ANCHOR
    reuse_scope: idea_only
  - id: DSH-DONOR-15-011
    family: donor
    source_section: "15"
    ordinal: 11
    kind: process
    source_text: "Input arriving after claim waits for a later boundary."
    assessment_anchor: "DSH_MINING_PLANNER_CONVO.md:681-681"
    primary_anchor: NO_PRIMARY_ANCHOR
