      terminal_commit_sequence_contract:
        start_boundary: begin_terminal_commit_and_record_intent_command executes all canonical closure/post validators, derives every live run_id from both ledgers plus the complete human/reviewer/actor authority set, rejects every operational collision, then writes/fsyncs the commit failure-writer canary before intent/start.
        supervision: 'The runner and failure writer share the exact stage vocabulary: prevalidation, render, commit, exact-commit validation, manifest publication, terminal validation, and interrupted restart. Every boundary catches BaseException. The runner requires either full failure validation after a successful writer or publication-hold validation after writer failure; empty/unvalidated failure publication cannot be ignored.'
        hold: terminal_commit_failure_validation_command must pass after successful failure publication; terminal_commit_failure_publication_validation_command proves the bounded orphan hold if publication is partial or unavailable. G0 and G2 reject the unsealed start in either case.
        reconciliation: terminal_commit_reconciliation_validation_command first re-derives the live all-row identity set, permits only the exact bound current-run operational rows in the failure ledger, rejects every collision in the main ledger or malformed same-run row, then requires live source identity and exact predecessor/manifest hold. Push embeds the same live gate immediately before mutation.
        failure_invocation: python3 -c <record_terminal_commit_failure_command body> ORIGINAL_RUNNER_RUN_ID FAILURE_STAGE ERROR_CLASS
        failure: record_terminal_commit_failure_command preserves an existing immutable record stage during interruption recovery. Publication and terminal failure validators accept at most one earlier authenticated writer-error row alongside the later same-intent record/observation, require its sequence and refs, and retain it as immutable evidence.
        render_commit_manifest: execute_atomic_terminal_commit_and_record_manifest_command is the sole executable two-file boundary. It validates identity and intent, atomically replaces destination-closed STATE, commits exactly STATE plus salvage, verifies parent/tree/path/clean status, atomically creates and validates the fixed manifest, appends terminal_commit_completed, and traps every exception or interruption into the failure writer.
        publication_hold: Closure and terminal publication validators reject empty publication. One bound failure record/observation or one authenticated writer-error row is required; an empty start remains an unsealed-intent condition.
        ledger_writes: All protected ledger appenders loop until the entire row payload is written before fsync. A short write or interruption remains inside the stage-aware failure boundary and cannot create an accepted partial row.
