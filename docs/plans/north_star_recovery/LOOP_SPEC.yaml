external_spend_limit_contract:
  required_approval_fields: [identity_mode, provider_or_target_identity, route, model, limit_value, unit, currency_or_not_applicable, request_cap, token_or_runtime_cap, consumed_before, remaining_before]
  identity_modes:
    provider: provider_or_target_identity route and model are nonempty strings
    target: provider_or_target_identity is a nonempty string and route and model are each the exact approved nonempty string or null
    participant_only: provider_or_target_identity route and model are all null
  numeric_rules: limit_value consumed_before and remaining_before are nonnegative numbers; request_cap is a nonnegative integer; token_or_runtime_cap is a nonnegative number; consumed_before plus remaining_before equals limit_value
  attempt_receipt_required_fields: [schema_version, approval_id, packet_key, participant_or_context_identity_sha256, identity_mode, provider_or_target_identity, route, model, environment_fingerprint_sha256, consumed_value, remaining_value, unit, request_count, token_or_runtime_consumed, started_at_utc, completed_at_utc]
  attempt_receipt_reference_fields: [path, sha256]
  receipt_invariants: every referenced receipt is dereferenced and its sha256 recomputed; participant_or_context_identity_sha256 is present; identity_mode and its provider target route and model values exactly match the approval and the typed identity-mode rule; consumed_value and remaining_value are nonnegative; consumed_value is at most the prior remaining value; remaining_value equals prior remaining value minus consumed_value; request_count is at most request_cap; token_or_runtime_consumed is at most token_or_runtime_cap; ordered balances are monotone; final aggregate counters and balance equal the ordered receipts
  enforcement: no request or target launch starts when its worst-case authorized consumption exceeds remaining_value or would exceed request_cap or token_or_runtime_cap; reaching or exceeding any one cap routes through external_spend_exhausted and over-cap receipts remain typed negative evidence; every attempt records a receipt, including failed and zero-cost actions; zero-cost routes require unit zero_cost and a zero value limit but retain request and token/runtime caps
state_materialization:
  output: docs/plans/north_star_recovery/STATE.json
  schema_after_G2: contracts/governance/schemas/bb.north_star_recovery.state.v1.schema.json
  validator_after_G2: scripts/packet/render_state.py
  validation_mode: fail_closed_before_frontier_selection
  pre_G2_bootstrap_validation:
    allowed_frontier: G0
    requires:
      - json_parse_passed
      - required_top_level_fields_present
      - packet_keys_and_dependencies_match_execution_plan
      - exact_source_identities_present
      - two_independent_exact_hash_planning_reviews_approved
    forbids:
      - implementation_packet_selection
      - treating_state_as_authored_input
  authored_input: false
  do_not_edit: true
  review_hash_policy:
    authored_artifacts: exact_current_hash_required
    state_artifact: bind_reviewed_pre_refresh_hash
    predecessor_field: planning_review_lineage.reviewed_pre_refresh_state_sha256
    external_manifest_schema: bb.north_star_recovery.state_handoff.v1
    external_manifest_required_fields:
      - schema_version
      - generated_at_utc
      - reviewed_pre_refresh_state_sha256
      - refreshed_state_sha256
      - authored_artifact_sha256s
      - reviewer_verdict_refs
    frontier_guard: predecessor_field_matches_reviewed_pre_refresh_hash_and_external_manifest_matches_current_state
    refreshed_state_must_record_predecessor_hash: true
    current_state_self_hash_location: external_run_or_handoff_manifest
  sources:
    - beads
    - github
    - exact_source_identity
    - immutable_evidence_refs
    - generated_claim_inventory
    - planning_review_verdicts_and_handoff_manifest
  required_fields:
    - generated_at_utc
    - generator
    - planning_review_lineage
    - source_identities
    - authority_matrix
    - packets
    - pull_requests
    - active_claim_summary
    - conflicts
    - blockers
    - next_frontier
    - approvals
    - completion
  conflict_policy: materialize_do_not_choose

