invalidation_event_bindings:
  source_identity_changed:
    includes:
    - head_changed
    - base_or_merge_base_changed
    - generated_input_changed
    applies_to: every_nonterminal_packet_state_except_bootstrap_select_frontier_and_refresh_state
    required_transition: source_identity_changed_to_refresh_state_from_every_source_or_generated_input_bound_state
    transition_action: invalidate_diff_paths_test_plan_integration_generated_fixed_point_dependent_claims_cached_generated_checks_local_tests_reviews_ci_promotion_exact_head_evidence_provider_target_and_scope_bound_approvals
    invalidates:
    - diff_budget_allowed_paths_test_plan_and_integration_risk
    - generated_fixed_point_dependent_claims_and_cached_generated_checks
    - local_tests_reviews_ci_promotion_exact_head_evidence_and_provider_target_results
    - scope_bound_approvals
    missing_route_action: block
  bound_evidence_identity_changed:
    includes:
    - target_identity_changed
    - fixture_identity_changed
    - provider_route_or_model_changed
    - comparator_version_changed
    - runtime_fingerprint_changed
    applies_to: every_target_fixture_provider_comparator_or_runtime_bound_state_including_blocked_verified_and_closed
    required_transition: bound_evidence_identity_changed_to_refresh_state
    transition_action: invalidate_target_fixture_provider_model_comparator_runtime_bound_results_reviews_dossiers_claims_cache_spend_approvals_closure_and_promotion
    missing_route_action: block
  terminal_states:
    states:
    - abandoned
    - superseded
    - complete
    identity_or_environment_change_behavior: remain_terminal_and_record_change_for_campaign_level_completion_reassessment
    transition_to_refresh_state: forbidden
invalidation:
  head_changed:
    invalidates:
    - local_test_results
    - independent_reviews
    - ci_status
    - promotion_eligibility
    - exact_head_results
    - evidence_dossiers
    - provider_or_target_results
  base_or_merge_base_changed:
    invalidates:
    - diff_budget
    - allowed_path_calculation
    - test_plan
    - independent_reviews
    - integration_risk
    - ci_status
    - promotion_eligibility
    - local_test_results
    - exact_head_results
    - evidence_dossiers
    - provider_or_target_results
  scope_changed:
    requires:
    - human_signed_amendment
    - new_scope_version
    - new_budget
    - scope_budget_amendment_gate_id_and_protected_action_are_exact
    - scope_budget_amendment_decision_is_granted
    - amendment_approval_binds_packet_old_and_new_scope_old_and_new_budget_base_merge_base_reason_and_expiry
    - review_reset
    - reason
  environment_changed:
    invalidates:
    - environment_bound_results
    - provider_or_target_results
    - ci_status
    - promotion_eligibility
    - evidence_dossiers
    - dependent_claims
    - scope_bound_approvals
  generated_input_changed:
    invalidates:
    - generated_fixed_point
    - dependent_claims
    - cached_generated_checks
proof_tiers:
  T0:
    target_seconds: 60
    includes:
    - changed_file_lint_and_type_checks
    - focused_owned_unit_tests
    - schema_validation
    - touched_generator_check
    - touched_package_import_cycle_check
    - phase20_freeze_validation
  T1:
    target_seconds: 180
    includes:
    - owning_package_tests
    - contract_boundary_tests
    - import_dependency_negatives
  T2:
    target_seconds: 600
    includes:
    - product_integration
    - clean_install_or_installed_wheel
    - generated_surface_fixed_point
  T3:
    includes:
    - required_github_ci
    - exact_head_integration_matrix
  T4:
    includes:
    - provider_or_target_preflight
    - frozen_capture
    - replay_and_comparison
    - exact_scope_claim_or_fixed_point
  derivation_inputs:
  - changed_paths
  - import_dependents
  - schema_consumers
  - generated_input_dependencies
  - conformance_owner_rows
  - packet_acceptance
  missing_mapping_action: block
cache_policy:
  required_key_parts:
  - packet_key
  - scope_version
  - source_tree_or_head_sha
  - base_sha
  - merge_base_sha
  - test_manifest_sha256
  - exact_command_sha256
  - dependency_lock_sha256
  - environment_fingerprint_sha256
  - generated_input_sha256s
  T4_additional_key_parts:
  - target_version
  - fixture_sha256
  - provider_route_and_model
  - comparator_version
  - runtime_fingerprint
  allow_cross_head_reuse: false
  record_cache_hit: true
review_policy:
  exact_head_required: true
  implementer_may_self_review: false
  default_reviewers:
  - specification_correctness
  dual_lens_packets:
  - G1
  - G2
  - R0
  - R1
  - R2
  - V1
  - P1
  - R3A
  - R3B
  - R3C
  - R4
  - N9B
  - N10
  - S1
  - A1
  - C1
  - F1
  second_lens: security_standards_generated_drift
  blocking_severities:
  - P0
  - P1
  - P2
  nonblocking_severities:
  - P3
  - Q
ci_policy:
  watchers_max: 1
  promotion_owners_max: 1
  reruns_max: 1
  classifications:
  - product_defect
  - specification_gap
  - flaky_check
  - environmental_hold
  - gate_defect
  skipped_required_check_is_green: false
  absent_guard_is_green: false
workers:
  supervisor:
    agent: loop-architect
    write_access: tracker_and_orchestration_only
    self_approval: false
  investigator:
    agent: scout
    write_access: none
  implementer:
    agent: loop-surgeon
    isolated_worktree: required
    write_access: packet_scope_only
    self_approval: false
  reviewer:
    agent: loop-reviewer
    write_access: none
  security_reviewer:
    agent: reviewer
    write_access: none
  ci_diagnostician:
    agent: ci-loop-diagnostician
    write_access: none
  state_renderer:
    agent: sonic
    write_access: state_file_only
bootstrap_policy:
  record_root: "../docs_tmp/north_star_recovery/bootstrap"
  json_validation_command: python3 -c "import json,sys; d=json.load(open(sys.argv[1], encoding='utf-8')); expected=set(sys.argv[2].split(',')); actual=set(d); literals=json.loads(sys.argv[4]); assert actual == expected, (sorted(expected-actual), sorted(actual-expected)); assert d['packet_key'] == sys.argv[3]; assert all(d.get(k) == v for k,v in literals.items()), literals" RECORD_PATH COMMA_SEPARATED_EXACT_KEYS PACKET_KEY LITERAL_REQUIREMENTS_JSON
  bootstrap_approval_record_schema:
    schema_version: bb.north_star_recovery.approval.v1
    exception_to_global_approval_record_required_fields: true
