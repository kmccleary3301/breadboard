    g0_predecessor_validation_command: >-
      python3 -c "import hashlib,json,pathlib,subprocess,sys; d=json.load(open(sys.argv[1],encoding='utf-8')); p=pathlib.Path(d['g0_post_record_path']); digest=lambda x:'sha256:'+hashlib.sha256(pathlib.Path(x).read_bytes()).hexdigest(); assert digest(p)==d['g0_post_record_sha256']; post=json.load(open(p,encoding='utf-8')); assert post['schema_version']=='bb.north_star_recovery.g0_postcheck.v1' and post['packet_key']=='G0' and post['no_product_file_changes'] is True; stems=['pre_record','closed_pr_receipt','superseded_bead_receipt','amended_graph_receipt','salvage_artifact','salvage_schema_validation_report','scope_diff_report','campaign_graph_approval_binding_receipt','post_campaign_graph_snapshot']; assert all(digest(post[s+'_path'])==post[s+'_sha256'] for s in stems); pre=json.load(open(post['pre_record_path'],encoding='utf-8')); run=lambda a:json.loads(subprocess.check_output(a,text=True)); pr=run(['gh','pr','view','44','--repo','kmccleary3301/breadboard','--json','state,mergedAt,headRefOid,baseRefOid']); assert pr=={'state':'CLOSED','mergedAt':None,'headRefOid':pre['source_pr_head_sha'],'baseRefOid':pre['source_pr_base_sha']}; old=run(['bd','show',pre['blocked_bead_id'],'--json'])[0]; assert old['status']=='closed' and 'supersed' in old.get('close_reason','').lower(); state=json.load(open('docs/plans/north_star_recovery/STATE.json',encoding='utf-8')); row=next(x for x in state['packets']['items'] if x['key']=='G0'); assert row['state']=='closed' and row['post_record_ref']==d['g0_post_record_path'] and row['post_record_sha256']==d['g0_post_record_sha256'] and set(post['packet_issue_map'])==set(pre['planned_packet_issue_titles']) and all(run(['bd','show',bid,'--json'])[0]['id']==bid for bid in post['packet_issue_map'].values())" RECORD_PATH
