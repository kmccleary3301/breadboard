      python3 -c "import hashlib,json,subprocess,sys; d=json.load(open(sys.argv[1],encoding='utf-8')); run=lambda a:subprocess.check_output(a,text=True).strip(); actual={'base_sha':run(['git','rev-parse',d['base_ref']]),'merge_base_sha':run(['git','merge-base','HEAD',d['base_ref']]),'head_sha':run(['git','rev-parse','HEAD']),'tree_sha':run(['git','rev-parse','HEAD^{tree}'])}; assert run(['gh','api','repos/kmccleary3301/breadboard/commits/main','--jq','.sha'])==d['base_sha'] and actual=={'base_sha':d['base_sha'],'merge_base_sha':d['merge_base_sha'],'head_sha':d['planning_head_sha'],'tree_sha':d['planning_tree_sha']}; a=d['governance_schema_approval_record']; c=d['governance_schema_approval_context']; canon=lambda x:'sha256:'+hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest(); keys={'schema_version','approval_id','approval_record_sha256','head_sha','tree_sha'}; assert set(c)==keys and c['schema_version']=='bb.north_star_recovery.g2_approval_context.v1' and c['approval_id']==a['approval_id'] and c['approval_record_sha256']==canon(a) and c['head_sha']==d['planning_head_sha'] and c['tree_sha']==d['planning_tree_sha']" RECORD_PATH
    preflight_required_commands: [pre_validation_command, approval_freshness_validation_command, phase20_freeze_validation_command, exact_base_review_validation_command, g0_predecessor_validation_command, current_source_prevalidation_command]
