    per_mutation_order: run the sequence check and exclusive no-follow boundary receipt writer, then invoke execute_protected_mutation_and_record_outcome_command with an action-run identity disjoint from every ledger, approval, reviewer, and author identity. Attempt 2 reuses the recovery record's fixed retry-pre snapshot as the actual boundary receipt snapshot; its path, digest, and bytes equal the failed attempt-1 post artifact. The runner independently revalidates the anchored preflight/ledger pair, fresh approvals including recovery authority, current source and remote main, clean worktree, and byte-identical immediate live tracker snapshot before deriving and executing the only canonical argv. It writes every result, snapshot, and outcome through root-FD O_NOFOLLOW|O_EXCL operations, then appends and fsyncs one identity-disjoint ledger row under an exclusive lock.
