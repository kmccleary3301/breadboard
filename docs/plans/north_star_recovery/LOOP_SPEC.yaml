schema_version: bb.north_star_recovery.loop_spec.v1
loop_id: north-star-recovery
status: approved_planning_direction
title: North-Star Recovery OMP Loop
owner: human
promotion_owner: supervisor
repo_root: breadboard_north_star_recovery_20260725
base_ref: origin/main
sync_before_spawn: true
model_routing_preflight:
  before_every_spawn: true
  inspect_effective_task_overrides: true
  forbidden_model_patterns:
    - fable
  require_explicit_resolved_model: true
  on_unverifiable_or_forbidden_route: do_not_spawn
  effort_is_relative_to_resolved_model: true
spawn_gate:
  applies_before_every_task_or_subagent_spawn: true
  required_record:
    - requested_agent
    - resolved_agent
    - resolved_model
    - effective_task_override_source
    - forbidden_pattern_check
    - checked_at_utc
  pass_condition: resolved_model_is_explicit_and_contains_no_forbidden_pattern
  on_failure:
    action: do_not_spawn
    packet_transition: blocked_external
    reason: model_route_unverifiable_or_forbidden

mission:
  goal: >-
    Establish one default BreadBoard product path across CLI, API, Python SDK,
    TypeScript SDK, and TUI; keep E4 as an internal opt-in evidence backend;
    rebuild replay through bounded R0-R4 packets; and prove product and evidence
    separately with clean-room falsifiers.
  success:
    - product_catalog_has_exactly_26_operations
    - e4_http_api_is_disabled_by_default
    - ordinary_clients_have_no_lane_or_claim_operations
    - replay_r0_through_r4_has_completed_execution_evidence
    - named_production_provider_conformance_passes
    - one_exact_scope_claim_is_generated_and_reverified
    - recovery_claim_record_has_execution_comparison_and_reverification_digests
    - product_outsider_falsifier_passes
    - evidence_outsider_falsifier_passes
    - no_unresolved_p0_or_p1_findings
    - compatibility_paths_have_removal_owners
  non_goals:
    - broad_repository_cleanup
    - historical_evidence_rewrite
    - cumulative_readiness_score
    - blanket_target_parity
    - provider_or_session_runtime_rewrite_in_one_packet
    - automatic_merge_or_release

required_artifacts:
  architecture: docs/plans/north_star_recovery/ARCHITECTURE_SPEC.md
  execution: docs/plans/north_star_recovery/EXECUTION_PLAN.md
  loop: docs/plans/north_star_recovery/LOOP_SPEC.yaml
  workers: docs/plans/north_star_recovery/WORKER_CONTRACTS.md
  state: docs/plans/north_star_recovery/STATE.json
  entry_prompt: docs/plans/north_star_recovery/GOAL_PROMPT.txt
  direction_charter: docs/DIRECTION_CHARTER.md
  freeze_policy: docs/plans/phase_20_right_shape/FREEZE_POLICY.md
  planning_review_record: STATE.json#planning_package.independent_review

source_authority:
  order:
    - exact_merged_source
    - exact_head_executed_results
    - frozen_target_capture
    - validated_replay_comparison_claim
    - regenerated_inventory_or_lock
    - github_and_beads
    - exact_base_head_packet_report
    - historical_score_or_progress
    - prose_or_transcript
  state_file_is_authority: false
  preserve_historical_evidence: true
  supersession_requires_explicit_successor: true

parallelism:
  max_subagents: 4
  max_isolated_writers: 2
  shared_checkout_writers: 0
  one_writer_per_worktree: true
  disjoint_files_required: true
  shared_contract_writes_serial: true
  generated_surface_writes_serial: true
  evidence_regeneration_serial: true
  state_render_serial: true

budgets:
  default:
    implementation_attempts_max: 2
    review_rounds_max: 2
    ci_reruns_max: 1
  tripwires:
    - percent: 70
      action: warn
    - percent: 85
      action: require_owner_acknowledgement
    - percent: 100
      action: block
  hard_block_on:
    - forbidden_path_changed
    - file_budget_exceeded
    - non_generated_line_budget_exceeded
    - implementation_attempts_exhausted
    - review_rounds_exhausted
    - ci_reruns_exhausted
    - dependency_not_closed
    - missing_test_ownership
    - stale_base_or_merge_base
    - unapproved_public_change
    - unapproved_security_change
    - planning_package_review_missing_or_stale
    - state_contract_invalid_for_current_phase
    - phase20_freeze_check_missing_or_failed
    - required_human_approval_missing_or_stale

packet_register:
  catalog_authority: bootstrap_policy.G0.pre_literal_requirements.planned_packet_issue_titles_and_planned_packet_dependencies
  rendered_copy: docs/plans/north_star_recovery/EXECUTION_PLAN.md#4-packet-register
  cross_validation_command: bootstrap_policy.G0.packet_catalog_cross_validation_command
  keys:
    - G0
    - G1
    - G2
    - R0
    - R1
    - R2
    - V1
    - P0
    - P1
    - R3A
    - R3B
    - R3C
    - R4
    - N9B
    - N10
    - S1
    - A1
    - C1
    - O1
    - O2
    - F1
  budget_owner: execution_plan
  scope_owner: execution_plan
packet_kinds:
  external_governance:
    - G0
  evidence_only:
    - O1
    - O2
  code_or_contract:
    - G1
    - G2
    - R0
    - R1
    - R2
    - V1
    - P0
    - P1
    - R3A
    - R3B
    - R3C
    - R4
    - N9B
    - N10
    - S1
    - A1
    - C1
    - F1

packet_human_gate_map:
  G0: [tracker_supersession, packet_closure, campaign_graph_rewrite]
  G1: [public_boundary, architecture_change]
  G2: [governance_schema]
  R0: [governance_schema]
  R1: [security_boundary]
  R2: [security_boundary, artifact_publication]
  V1: [public_boundary]
  P0: []
  P1: [architecture_change]
  R3A: []
  R3B: [security_boundary]
  R3C: [security_boundary]
  R4: [architecture_change]
  N9B: [external_spend]
  N10: [artifact_publication]
  S1: [architecture_change]
  A1: [public_boundary, security_boundary]
  C1: [public_boundary]
  O1: [external_spend]
  O2: [external_spend]
  F1: []
  missing_mapping_action: block
dynamic_human_gate_map:
  scope_or_budget_expansion: [scope_budget_amendment]
  partial_external_governance_recovery: [partial_governance_recovery]
  missing_mapping_action: block
postverification_human_gate_map:
  F1: [release]
  missing_mapping_action: block



states:
  - bootstrap
  - refresh_state
  - select_frontier
  - preflight
  - preimplementation_approval
  - evidence_running
  - evidence_review_requested
  - implementing
  - local_gates
  - review_requested
  - changes_requested
  - approved
  - ci_pending
  - ci_failed
  - ci_green
  - promotion_gate
  - human_approval
  - scope_budget_approval
  - merge_ready
  - merged
  - post_merge_verify
  - verified
  - closure_pending_receipt
  - g0_terminal_handoff
  - closed
  - blocked_scope
  - blocked_budget
  - blocked_dependency
  - blocked_environment
  - blocked_external
  - blocked_review
  - abandoned
  - superseded
  - complete

terminal_states:
  - abandoned
  - superseded
  - complete

transitions:
  - from: bootstrap
    event: run_started
    to: refresh_state
    actions:
      - read_repo_instructions
      - read_required_artifacts
      - run_bd_prime
      - verify_base_ref
  - from: refresh_state
    event: authorities_loaded
    to: select_frontier
    guards:
      - source_identity_recorded
      - beads_reachable
      - github_reachable_or_explicitly_blocked
      - state_conflicts_materialized
      - state_contract_valid_for_current_phase
      - planning_package_review_approved
      - reviewed_authored_artifact_hashes_match_and_state_review_input_lineage_valid
    actions:
      - render_state_from_authorities
  - from: select_frontier
    event: packet_selected
    to: preflight
    guards:
      - selected_packet_key_and_title_match_registered_open_nonterminal_packet_and_rendered_next_frontier
      - dependencies_closed
      - no_overlapping_writer_scope
      - human_gate_requirements_classified
      - implementation_owner_route_preflight_passed_or_no_spawn_needed
  - from: select_frontier
    event: g0_bootstrap_selected
    to: preflight
    guards:
      - selected_packet_is_G0_and_rendered_next_frontier_is_G0_preflight_and_human_gates
      - legacy_bootstrap_control_bead_bb_06u_11_is_blocked_and_exact_title_matches
      - no_materialized_G0_packet_issue_exists
      - no_preexisting_north_star_recovery_or_planned_packet_key_label_exists
      - round_current_exact_hash_planning_reviews_approved
      - implementation_owner_route_preflight_passed_or_no_spawn_needed
      - G0_dependencies_are_empty
      - G0_bootstrap_scope_budget_paths_and_human_gates_match_bootstrap_policy
      - current_remote_main_and_clean_execution_root_are_recorded
      - current_state_conflicts_are_materialized_without_selecting_historical_source
    actions:
      - initialize_closed_G0_bootstrap_preflight_record
      - retain_legacy_blocked_bead_as_bootstrap_control_only
      - do_not_select_any_code_or_contract_packet
  - from: preflight
    event: preflight_passed
    to: implementing
    guards:
      - exact_base_recorded
      - exact_merge_base_recorded
      - allowed_and_forbidden_paths_recorded
      - budgets_recorded
      - test_plan_derived
      - behavior_reproduced_on_base_when_applicable
      - isolated_worktree_created
      - scope_budget_amendment_approval_current_if_scope_or_budget_changed_since_prior_scope_version
      - packet_human_gate_ids_empty
      - packet_checker_passed_or_selected_packet_is_G0_with_valid_g0_bootstrap_record_or_selected_packet_is_G2_with_valid_g2_bootstrap_record
      - phase20_freeze_preflight_passed
  - from: preflight
    event: preimplementation_human_approval_required
    to: preimplementation_approval
    guards:
      - approval_request_names_packet_scope_base_merge_base_budget_and_protected_action
      - packet_human_gate_ids_nonempty
      - every_required_gate_id_is_named
      - proposed_action_or_change_is_exact_enough_to_decide
      - common_preflight_record_matches_current_packet_base_merge_base_scope_budget_paths_test_plan_behavior_worktree_checker_or_bootstrap_and_freeze
      - scope_budget_amendment_approval_current_if_scope_or_budget_changed_since_prior_scope_version
  - from: preimplementation_approval
    event: bootstrap_approval_granted_for_exact_scope
    to: implementing
    guards:
      - selected_packet_is_G0_or_G2
      - selected_bootstrap_closed_preflight_record_passes_every_required_command
      - bootstrap_approval_gate_ids_exactly_equal_packet_human_gate_map
      - every_bootstrap_approval_decision_is_granted
      - every_bootstrap_approval_protected_action_matches_the_closed_record_for_its_gate
      - G0_direct_approvals_bind_both_source_PR_head_and_planning_head_tree_or_selected_packet_is_G2
      - campaign_graph_approval_binds_exact_titles_dependencies_snapshot_planning_head_tree_and_scope_or_selected_packet_is_G2
      - bootstrap_approval_freshness_and_minimum_remaining_expiry_margin_pass_immediately_before_first_protected_action
      - current_source_external_authority_snapshot_and_clean_worktree_revalidated_immediately_before_first_protected_action
      - common_preflight_record_matches_current_packet_base_merge_base_scope_budget_paths_test_plan_behavior_worktree_bootstrap_and_freeze
      - phase20_freeze_preflight_passed
    actions:
      - consume_bootstrap_approval_records_only_for_their_named_G0_or_G2_actions
      - record_immediate_pre_action_validation_receipt
      - begin_bootstrap_action_attempt
  - from: preimplementation_approval
    event: approval_granted_for_exact_scope
    to: implementing
    guards:
      - packet_kind_is_code_or_contract_or_external_governance
      - all_required_preimplementation_approvals_current
      - all_required_preimplementation_approval_decisions_are_granted
      - approval_gate_ids_exactly_equal_packet_human_gate_map
      - approval_record_bound_to_packet_scope_base_merge_base_and_expiry
      - every_approval_record_protected_action_exactly_equals_the_current_approval_request_protected_action_for_the_same_gate
      - every_approval_record_head_sha_equals_current_packet_head_when_a_head_exists_and_is_absent_only_before_any_packet_head_exists
      - common_preflight_record_matches_current_packet_base_merge_base_scope_budget_paths_test_plan_behavior_worktree_checker_or_bootstrap_and_freeze
      - scope_budget_amendment_approval_current_if_scope_or_budget_changed_since_prior_scope_version
      - external_spend_approval_matches_named_provider_target_route_model_environment_exact_numeric_limit_units_request_token_or_runtime_caps_consumed_remaining_scope_and_expiry_when_gate_present
      - packet_checker_passed_or_selected_packet_is_G0_with_valid_g0_bootstrap_record_or_selected_packet_is_G2_with_valid_g2_bootstrap_record
      - phase20_freeze_preflight_passed
  - from: preimplementation_approval
    event: evidence_approval_granted_for_exact_scope
    to: evidence_running
    guards:
      - packet_kind_is_evidence_only
      - all_required_preimplementation_approvals_current
      - all_required_preimplementation_approval_decisions_are_granted
      - approval_gate_ids_exactly_equal_packet_human_gate_map
      - external_spend_approvals_match_target_environment_exact_numeric_limit_units_request_token_or_runtime_caps_consumed_remaining_and_expiry
      - approval_record_bound_to_packet_scope_base_merge_base_and_expiry
      - every_approval_record_protected_action_exactly_equals_the_current_approval_request_protected_action_for_the_same_gate
      - every_approval_record_head_sha_equals_current_packet_head_when_a_head_exists_and_is_absent_only_before_any_packet_head_exists
      - common_preflight_record_matches_current_packet_base_merge_base_scope_budget_paths_test_plan_behavior_worktree_checker_or_bootstrap_and_freeze
      - scope_budget_amendment_approval_current_if_scope_or_budget_changed_since_prior_scope_version
      - phase20_freeze_preflight_passed
  - from: preimplementation_approval
    event: approval_denied
    to: blocked_scope
    guards:
      - approval_gate_ids_exactly_equal_packet_human_gate_map
      - approval_record_matches_packet_scope_base_head_merge_base_and_expiry
      - approval_decision_is_denied
  - from: preimplementation_approval
    event: source_identity_changed
    to: refresh_state
    actions: &source_refresh_actions
      - invalidate_diff_paths_test_plan_integration_generated_fixed_point_dependent_claims_cached_generated_checks_local_tests_reviews_ci_promotion_exact_head_evidence_provider_target_and_scope_bound_approvals
  - from: preflight
    event: dependency_missing
    to: blocked_dependency
  - from: preflight
    event: scope_invalid
    to: blocked_scope
  - from: preflight
    event: environment_missing
    to: blocked_environment
  - from: implementing
    event: implementation_yielded
    to: local_gates
    guards:
      - packet_checker_passed_and_if_selected_packet_is_G2_valid_digest_bound_g2_postcheck_record_present_or_selected_packet_is_G0_with_valid_g0_postcheck_record
      - no_stub_or_todo_delivery
      - no_forbidden_path_change
      - budgets_below_100_percent
      - phase20_freeze_check_passed
  - from: implementing
    event: budget_exhausted
    to: blocked_budget
    guards:
      - file_or_line_or_attempt_budget_counter_is_at_limit
  - from: implementing
    event: implementation_attempts_exhausted
    to: blocked_budget
    guards:
      - implementation_budget_record_matches_current_packet_scope_base_head_if_present_merge_base_and_environment
      - implementation_attempt_counter_is_at_limit
  - from: implementing
    event: external_governance_action_failed_or_partially_mutated
    to: blocked_external
    guards:
      - selected_packet_is_G0_and_packet_kind_is_external_governance
      - typed_failure_and_partial_receipts_match_current_source_scope_action_attempt_and_exact_granted_bootstrap_approvals
      - external_governance_attempt_counter_is_one_and_at_packet_limit
      - completed_and_remaining_mutations_are_enumerated_from_live_authorities
      - no_success_verification_closure_or_promotion_claimed
      - no_further_external_mutation_without_a_new_exact_recovery_approval_request
    actions:
      - render_state_from_authorities
      - push_beads_remote
  - from: local_gates
    event: required_local_tiers_passed
    to: review_requested
    guards:
      - exact_head_recorded
      - test_results_bound_to_head
      - independent_reviewer_route_preflight_passed
      - generated_outputs_at_fixed_point_if_touched
  - from: local_gates
    event: product_defect
    to: preflight
    guards:
      - implementation_attempt_available
    actions:
      - invalidate_review_ci_and_exact_head_results
  - from: local_gates
    event: implementation_attempts_exhausted
    to: blocked_budget
    guards:
      - implementation_budget_record_matches_current_packet_scope_base_head_merge_base_and_environment
      - implementation_attempt_counter_is_at_limit
  - from: local_gates
    event: external_requirement_missing
    to: blocked_external
  - from: review_requested
    event: reviewer_changes_requested
    to: changes_requested
    guards:
      - findings_are_exact_head
      - review_matches_current_base_head_merge_base_scope_and_environment
      - review_round_available
  - from: changes_requested
    event: remediation_authorized
    to: preflight
    guards:
      - implementation_attempt_available
    actions:
      - route_only_actionable_findings
      - invalidate_review_ci_and_exact_head_results
  - from: changes_requested
    event: implementation_attempts_exhausted
    to: blocked_budget
    guards:
      - implementation_budget_record_matches_current_packet_scope_base_head_merge_base_and_environment
      - implementation_attempt_counter_is_at_limit
  - from: review_requested
    event: all_required_reviewers_approved
    to: approved
    guards:
      - no_open_p0_p1_p2_findings
      - reviews_match_base_and_head
      - reviews_match_merge_base_and_scope_version
      - external_spend_receipts_match_approval_and_consumed_plus_remaining_equals_limit_when_gate_present
      - reviews_match_environment_and_target_identity
  - from: review_requested
    event: review_budget_exhausted
    to: blocked_review
    guards:
      - review_budget_record_matches_current_base_head_merge_base_scope_and_environment
      - review_round_counter_is_at_limit
  - from: approved
    event: external_governance_actions_completed
    to: verified
    guards:
      - packet_kind_is_external_governance
      - exact_protected_action_approvals_current
      - exact_protected_action_approval_decisions_are_granted
      - action_receipts_match_approved_issue_pr_and_graph_mutations
      - selected_packet_is_G0_and_valid_digest_bound_g0_postcheck_record_matches_current_source_scope_and_action_receipts
      - schema_valid_salvage_artifact_and_exact_scope_diff_match_g0_postcheck_and_approved_successor_graph
      - no_code_pr_ci_merge_or_product_change_claimed
    actions:
      - render_state_from_authorities
      - push_beads_remote
  - from: approved
    event: external_governance_action_failed_or_partially_mutated
    to: blocked_external
    guards:
      - packet_kind_is_external_governance
      - typed_failure_and_partial_receipts_match_current_source_scope_action_attempt_and_exact_granted_approvals
      - external_governance_attempt_counter_is_one_and_at_packet_limit
      - completed_and_remaining_mutations_are_enumerated_from_live_authorities
      - no_success_verification_closure_or_promotion_claimed
      - no_further_external_mutation_without_a_new_exact_recovery_approval_request
    actions:
      - render_state_from_authorities
      - push_beads_remote
  - from: approved
    event: ci_started
    to: ci_pending
    guards:
      - packet_kind_is_code_or_contract
      - ci_run_matches_current_head_base_merge_base_and_environment
      - external_spend_receipts_match_approval_and_remain_within_exact_limit_when_gate_present
      - one_ci_watcher_registered
  - from: ci_pending
    event: ci_product_defect
    to: ci_failed
    guards:
      - ci_run_matches_current_head_base_merge_base_and_environment
  - from: ci_pending
    event: ci_environmental_hold
    to: blocked_environment
    guards:
      - ci_run_matches_current_head_base_merge_base_and_environment
  - from: ci_pending
    event: ci_gate_defect
    to: blocked_external
    guards:
      - ci_run_matches_current_head_base_merge_base_and_environment
  - from: ci_pending
    event: required_ci_passed
    to: ci_green
    guards:
      - ci_run_matches_current_head_base_merge_base_and_environment
      - required_ci_checks_are_not_skipped
  - from: ci_failed
    event: fix_authorized
    to: preflight
    guards:
      - ci_rerun_available
      - failed_ci_record_matches_current_head_base_merge_base_and_environment
      - implementation_attempt_available
    actions:
      - invalidate_review_ci_and_exact_head_results
  - from: ci_failed
    event: ci_reruns_or_implementation_attempts_exhausted
    to: blocked_budget
    guards:
      - ci_and_implementation_budget_records_match_current_packet_scope_base_head_merge_base_and_environment
      - ci_rerun_or_implementation_attempt_counter_is_at_limit
  - from: ci_green
    event: promotion_preflight_passed
    to: promotion_gate
    guards:
      - packet_kind_is_code_or_contract
      - exact_head_unchanged
      - exact_base_unchanged
      - exact_merge_base_unchanged
      - exact_environment_fingerprint_unchanged
      - packet_checker_passed
      - required_evidence_present
      - no_open_p0_p1_p2_findings
  - from: promotion_gate
    event: merge_approval_required
    guards:
      - packet_kind_is_code_or_contract
    to: human_approval
  - from: human_approval
    event: approval_granted_for_exact_head
    to: merge_ready
    guards:
      - packet_kind_is_code_or_contract
      - approval_gate_id_is_merge_and_protected_actions_are_exact
      - approval_record_matches_packet_pr_head_base_merge_base_scope_and_expiry
      - merge_approval_decision_is_granted
  - from: human_approval
    event: approval_denied
    guards:
      - approval_request_matches_current_packet_scope_base_head_merge_base_and_expiry
      - approval_decision_is_denied
    to: blocked_scope
  - from: human_approval
    event: source_identity_changed
    to: refresh_state
    actions: *source_refresh_actions
  - from: merge_ready
    event: source_identity_changed
    to: refresh_state
    actions: *source_refresh_actions
  - from: merge_ready
    event: human_merged
    to: merged
    guards:
      - packet_kind_is_code_or_contract
      - approval_gate_id_is_merge_and_protected_actions_are_exact
      - approval_record_matches_packet_pr_head_base_merge_base_scope_and_expiry
      - merge_approval_decision_is_granted
      - human_merge_approval_current
      - merge_policy_allows
      - merged_commit_recorded
  - from: merged
    event: post_merge_checks_started
    to: post_merge_verify
  - from: post_merge_verify
    event: post_merge_checks_passed
    to: verified
    guards:
      - post_merge_results_match_current_merged_commit_and_environment
  - from: post_merge_verify
    event: post_merge_checks_failed
    to: blocked_external
    guards:
      - typed_post_merge_failure_record_matches_current_merged_commit_scope_environment_and_checks
      - no_packet_closure_or_success_claimed
  - from: post_merge_verify
